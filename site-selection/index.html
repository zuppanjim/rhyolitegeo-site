/* ---------- map ----------
   Drawn, not tiled. The published page's CSP admits external scripts from four
   CDNs and admits no external images or fetches at all, so maps.googleapis.com
   cannot load here and neither can raster tiles from any host. Every mark below
   is measured geometry shipped in maps/<region>.js. */
const MAPW = 820, MAPPAD = 26;

/* ---------- colocation hosts (rhyolitegeo 2e66691) ----------
   A hexagon per host with a coordinate. Filled = the operator's posture is
   graded (STRANDED solid, SOLICITING / HOSTED_BEFORE solid with a dark rim);
   CONTRACTED is a thin outline; UNKNOWN is a dashed hollow outline, so an
   unanswered question never reads as a graded one. */
function hexD(cx, cy, r){
  let d = "";
  for (let k = 0; k < 6; k++){ const a = Math.PI/3*k + Math.PI/6;
    d += (k ? "L" : "M") + (cx + r*Math.cos(a)).toFixed(1) + " " + (cy + r*Math.sin(a)).toFixed(1); }
  return d + "Z";
}
function hostPaint(p){
  if (p === "STRANDED") return `fill="var(--m-host)" stroke="var(--panel)"`;
  if (p === "SOLICITING" || p === "HOSTED_BEFORE") return `fill="var(--m-host)" stroke="var(--ink)"`;
  if (p === "CONTRACTED") return `fill="var(--panel)" fill-opacity=".6" stroke="var(--m-host)"`;
  return `fill="var(--panel)" fill-opacity=".35" stroke="var(--m-host)" stroke-dasharray="2.2 1.8"`;
}
const hostsDrawn = m => (m.colocation_hosts||[]).filter(h => h.has_coords && h.lat != null && h.lon != null).length;
function hostLegend(m){
  const drawn = (m.colocation_hosts||[]).filter(h => h.has_coords && h.lat != null && h.lon != null);
  const n = p => drawn.filter(h => (h.posture||"UNKNOWN") === p).length;
  const sw = p => `<svg width="14" height="14" viewBox="0 0 14 14" style="flex:none"><path d="${hexD(7,7,5.6)}" ${hostPaint(p)} stroke-width="1.4"/></svg>`;
  const unplaced = (m.colocation_hosts||[]).length - drawn.length;
  const rows = [[sw("STRANDED"), `colocation host, STRANDED (${n("STRANDED")})`]];
  const graded = n("SOLICITING") + n("HOSTED_BEFORE");
  if (graded) rows.push([sw("SOLICITING"), `colocation host, SOLICITING or HOSTED_BEFORE (${graded})`]);
  if (n("CONTRACTED")) rows.push([sw("CONTRACTED"), `colocation host, CONTRACTED (${n("CONTRACTED")})`]);
  const other = drawn.length - n("STRANDED") - graded - n("CONTRACTED");
  rows.push([sw("UNKNOWN"), `colocation host, posture UNKNOWN (${other})${unplaced ? " · " + unplaced + " not drawn, no coordinate" : ""}`]);
  return rows;
}
/* Every host field, so the catch-all on a card does not repeat them. */
const HOST_KEYS = ["host_row","posture","posture_tier","posture_reason","posture_evidence",
  "point_of_connection","fiber_screen","fiber_lit","fiber_second_path",
  "fiber_route_mi","fiber_route_provider","fiber_route_source","fiber_route_source_id",
  "fiber_diversity_grade","fiber_basis","doc_hits","doc_hits_total",
  "host_name","host_fuel","host_fuel_class","host_spare_mw","host_lat","host_lon","has_coords"];
const hasHost = r => !!r && HOST_KEYS.some(k => k in r);
function hostHtml(r){
  if (!hasHost(r)) return "";                      // an older build: card unchanged
  const U = v => (v == null || v === "") ? ["UNKNOWN", "unk"] : [v, ""];
  const row = (k, v) => { const [t, c] = U(v); return [k, t, c]; };
  const flag = v => v === true ? "yes" : v === false ? "no" : null;
  const lnk = (u, t) => u && /^https?:\/\//.test(u)
    ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>` : "";
  const tier = t => t ? `<span class="t">${esc(t)}</span>` : "";
  const unk = `<p class="hev" style="margin:0;font-size:13px"><span class="u">UNKNOWN</span></p>`;
  const ev = Array.isArray(r.posture_evidence) ? r.posture_evidence : [];
  const evHtml = ev.length ? `<ul class="srcl hev">` + ev.map(e => {
      const what = e.kind === "curtailment"
        ? "curtailed " + (e.pct == null ? "UNKNOWN" : fx(e.pct,1) + "%") + (e.basis ? ", " + esc(e.basis) : "")
        : e.kind === "hosted_before" ? "has hosted load before"
        : e.kind === "soliciting" ? "soliciting colocated load"
        : esc(titl(e.kind || "evidence")) + (e.pct == null ? "" : " " + fx(e.pct,1) + "%") + (e.basis ? ", " + esc(e.basis) : "");
      return `<li>${what}${tier(e.tier)}${e.snippet ? `<br><span class="q">“${esc(e.snippet)}”</span>` : ""}`
        + `${e.url ? " " + lnk(e.url, "source") : ' <span class="u">source not recorded</span>'}</li>`;
    }).join("") + `</ul>` : unk;
  const hits = Array.isArray(r.doc_hits) ? r.doc_hits : [];
  const total = r.doc_hits_total == null ? hits.length : r.doc_hits_total;
  const more = total > hits.length ? `<li class="u">${num(total - hits.length)} more not listed (${num(total)} on file)</li>` : "";
  const hitHtml = hits.length ? `<ul class="srcl hev">` + hits.map(d =>
      `<li>${lnk(d.url, (d.filer || "filer not recorded") + " · " + (d.verdict || "verdict not recorded")) || esc((d.filer||"filer not recorded") + " · " + (d.verdict||"verdict not recorded"))}`
      + `${tier(d.tier)}${d.snippet ? `<br><span class="q">“${esc(d.snippet)}”</span>` : ""}</li>`).join("") + more + `</ul>` : unk;
  return sub("Host evidence") + kv([
      row("host record", r.host_row === true ? "graded (hosts row)" : null),
      row("posture", r.posture),
      row("posture tier", r.posture_tier),
      row("posture reason", r.posture_reason),
      row("point of connection", r.point_of_connection),
      row("fiber screen", r.fiber_screen)
    ])
    + sub("Posture evidence") + evHtml
    + sub("Fiber at the host") + kv([
      row("fiber lit", flag(r.fiber_lit)),
      row("second path", flag(r.fiber_second_path)),
      row("route distance", r.fiber_route_mi == null ? null : fx(r.fiber_route_mi,2) + " mi"),
      row("route provider", r.fiber_route_provider),
      row("route source", r.fiber_route_source == null ? null
        : r.fiber_route_source + (r.fiber_route_source_id && r.fiber_route_source_id !== r.fiber_route_source ? " (" + r.fiber_route_source_id + ")" : "")),
      row("diversity grade", r.fiber_diversity_grade == null ? null : String(r.fiber_diversity_grade)),
      row("fiber basis", r.fiber_basis)
    ])
    + sub("Documents" + (total ? " (" + num(total) + ")" : "")) + hitHtml;
}

function projector(m){
  const pts = [];
  m.outline.forEach(r => r.forEach(p => pts.push(p)));
  m.finalists.forEach(f => pts.push([f.lon, f.lat]));
  if (!pts.length) return null;
  const lat0 = Math.min(...pts.map(p=>p[1])), lat1 = Math.max(...pts.map(p=>p[1]));
  const k = Math.cos((lat0+lat1)/2 * Math.PI/180);
  const xs = pts.map(p=>p[0]*k);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = lat0, y1 = lat1;
  // A ring can stand outside the state outline, so pad by the largest one.
  const pad = Math.max(0.12, ...m.anchors.map(a=>a.radius_miles/69*1.4));
  x0 -= pad*k; x1 += pad*k; y0 -= pad; y1 += pad;
  const sc = (MAPW - 2*MAPPAD) / (x1 - x0);
  const H = Math.round((y1 - y0) * sc + 2*MAPPAD);
  return {
    H, sc,
    x: lon => MAPPAD + (lon*k - x0) * sc,
    y: lat => H - MAPPAD - (lat - y0) * sc,
    mi: miles => (miles/69) * sc        // projected units are equal-latitude degrees
  };
}

function polyline(path, P){
  if (path.length < 2) return "";
  return "M" + path.map(p => P.x(p[0]).toFixed(1)+" "+P.y(p[1]).toFixed(1)).join("L");
}

/* ---------- brownfield sites (rhyolitegeo c178e19) ----------
   Cold storage and heavy-power industrial plants. Idle is a sourced fact or it
   is UNKNOWN: a site with closure evidence draws solid, one without draws
   hollow and faint. Thousands of points in a big state, so each mark is one
   short path (a snowflake or a sawtooth roof), never a <use> or a filter. */
const BROWN_KEYS = ["id","name","type","city","naics","sources","availability","idle",
  "on_parcel","source_url","lat","lon"];
const bfIdle = b => b.availability != null && b.availability !== "" && b.availability !== "UNKNOWN";
const bfLeg = (m, t) => (m.brownfield_legend || []).find(l => l.type === t)
  || {type: t, label: titl(String(t||"brownfield site").toLowerCase()), marker: "factory"};
const bfTok = mk => mk === "snowflake" ? "--m-cold" : "--m-plant";
function snowD(x, y, r){
  const a = (r/2).toFixed(1), b = (r*0.866).toFixed(1), c = (r*1.732).toFixed(1);
  return `M${(x-r).toFixed(1)} ${y.toFixed(1)}h${2*r}M${(x-r/2).toFixed(1)} ${(y-r*0.866).toFixed(1)}l${r} ${c}`
    + `M${(x-r/2).toFixed(1)} ${(y+r*0.866).toFixed(1)}l${r} -${c}`;
}
function factD(x, y){
  return `M${(x-5).toFixed(1)} ${(y+4).toFixed(1)}v-5l3-2v2l3-2v2l2-1.4V${(y-5).toFixed(1)}h2V${(y+4).toFixed(1)}Z`;
}
function bfMark(mk, x, y, idle){
  const t = bfTok(mk);
  if (mk === "snowflake") return idle
    ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="var(${t})"/><path d="${snowD(x,y,4.2)}" stroke="var(--panel)" stroke-width="1.3" fill="none"/>`
    : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.2" fill="var(--panel)" fill-opacity=".35"/><path d="${snowD(x,y,4.6)}" stroke="var(${t})" stroke-width="1.1" stroke-opacity=".6" fill="none"/>`;
  return idle
    ? `<path d="${factD(x,y)}" fill="var(${t})" stroke="var(--panel)" stroke-width="1"/>`
    : `<path d="${factD(x,y)}" fill="var(--panel)" fill-opacity=".4" stroke="var(${t})" stroke-opacity=".7" stroke-width="1"/>`;
}
function bfLegend(m){
  const rows = [];
  const drawn = (m.brownfield || []).filter(b => b.lat != null && b.lon != null);
  const types = [...(m.brownfield_legend || []).map(l => l.type),
    ...drawn.map(b => b.type).filter(t => !(m.brownfield_legend || []).some(l => l.type === t))];
  [...new Set(types)].forEach(t => {
    const L = bfLeg(m, t), of = drawn.filter(b => b.type === t);
    const sw = idle => `<svg width="14" height="14" viewBox="0 0 14 14" style="flex:none">${bfMark(L.marker, 7, 7, idle)}</svg>`;
    const ni = of.filter(bfIdle).length;
    rows.push([sw(true), `${L.label}, idle evidence (${ni})`]);
    rows.push([sw(false), `${L.label}, availability UNKNOWN (${of.length - ni})`]);
  });
  return rows;
}

/* ---------- existing data centers and crypto mines (rhyolitegeo 96b5d09) ----------
   `facilities` is {markers, legend, site_types, counts}. A data center is a
   square, a mine a diamond. IDLE or CLOSED on a sourced fact is a candidate and
   carries a ring; OPERATING, PLANNED and UNKNOWN are context, drawn muted. */
const FAC_KEYS = ["kind","name","operator","lat","lon","status","status_tier","candidate",
  "idle_line","sources","parcel_id","parcel_match","mw","sqft","source_url","retrieved_at"];
const facRows = m => (m.facilities && Array.isArray(m.facilities.markers)) ? m.facilities.markers : null;
const facCand = f => f.candidate === true || f.status === "IDLE" || f.status === "CLOSED";
const facMine = f => f.kind === "EXISTING_MINE";
const facLabel = (m, k) => ((m.facilities && m.facilities.legend) || []).find(l => l.key === k)?.label
  || (k === "EXISTING_MINE" ? "Existing crypto-mining site" : "Existing data center");
function facMark(f, x, y){
  const t = facMine(f) ? "--m-mine" : "--m-dc", c = facCand(f);
  const shape = facMine(f)
    ? `<path d="M${x.toFixed(1)} ${(y-5).toFixed(1)}l5 5l-5 5l-5-5Z"`
    : `<rect x="${(x-4).toFixed(1)}" y="${(y-4).toFixed(1)}" width="8" height="8"`;
  return (c ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="none" stroke="var(--m-cand)" stroke-width="1.8"/>` : "")
    + shape + (c ? ` fill="var(${t})" stroke="var(--panel)" stroke-width="1"/>`
                 : ` fill="var(${t})" fill-opacity=".3" stroke="var(${t})" stroke-opacity=".55" stroke-width="1"/>`);
}
function facLegend(m){
  const rows = facRows(m) || [];
  const sw = f => `<svg width="18" height="18" viewBox="0 0 18 18" style="flex:none">${facMark(f, 9, 9)}</svg>`;
  const nc = rows.filter(facCand).length;
  return [
    [sw({kind:"EXISTING_DC"}), `${facLabel(m,"EXISTING_DC")} (${rows.filter(f => !facMine(f)).length})`],
    [sw({kind:"EXISTING_MINE"}), `${facLabel(m,"EXISTING_MINE")} (${rows.filter(facMine).length})`],
    [sw({kind:"EXISTING_DC", status:"IDLE"}), `ring: IDLE or CLOSED on a sourced fact, candidate (${nc})`],
    [sw({kind:"EXISTING_DC", status:"OPERATING"}), `muted: OPERATING, PLANNED or UNKNOWN, context (${rows.length - nc})`]
  ];
}

function mapHtml(m){
  const P = projector(m);
  if (!P) return "";
  const out = [];
  out.push(`<svg viewBox="0 0 ${MAPW} ${P.H}" role="img" aria-label="${esc(m.name)}: ranked sites, generation anchors, fiber routes, transmission lines and carrier facilities">`);
  out.push(`<rect x="0" y="0" width="${MAPW}" height="${P.H}" fill="var(--panel)"/>`);
  // state body, so everything else reads as inside or outside it
  const body = m.outline.map(r => polyline(r, P) + "Z").join(" ");
  if (body.trim()) out.push(`<path d="${body}" fill="var(--ground)" stroke="var(--rule)" stroke-width="1.2"/>`);
  // transmission lines: the reason a site is worth anything, so they sit under
  // everything but are never omitted. Thickness by voltage class where HIFLD
  // published one; unknown voltage draws at the thin weight, not at zero.
  out.push(`<g data-l="power">`);
  m.power.forEach((l,i) => {
    const kv = l.kv, hv = kv != null && kv >= 345;
    const w = kv == null ? 0.9 : hv ? 2.4 : kv >= 161 ? 1.7 : 1.1;
    out.push(`<path class="hit" data-k="power" data-i="${i}" d="${polyline(l.path,P)}" fill="none"`
      + ` stroke="var(--m-power${hv?"-hv":""})"`
      + ` stroke-width="${w}" stroke-opacity="${kv == null ? .45 : .85}"`
      + `><title>${esc(l.owner||"owner not published")}`
      + ` · ${kv == null ? "voltage not published" : kv+" kV"}${l.status?" · "+esc(l.status):""}</title></path>`);
  });
  out.push(`</g><g data-l="fiber">`);
  m.fiber.forEach((f,i) => {
    const done = /complete/i.test(f.status||"");
    out.push(`<path class="hit" data-k="fiber" data-i="${i}" data-s="${done?"done":"plan"}" d="${polyline(f.path,P)}" fill="none"`
      + ` stroke="var(--m-fiber${done?"":"-plan"})"`
      + ` stroke-width="${done?2:1.7}" stroke-opacity="${done?1:.9}"${done?"":' stroke-dasharray="5 4"'}>`
      + `<title>${esc(f.provider||"provider not published")} · ${esc(f.status||"status not published")}</title></path>`);
  });
  out.push(`</g><g data-l="ring">`);
  // the radius that admitted the parcels
  m.anchors.forEach((a,i) => out.push(
    `<circle class="hit" data-k="anchor" data-i="${i}" cx="${P.x(a.lon).toFixed(1)}" cy="${P.y(a.lat).toFixed(1)}"`
    + ` r="${P.mi(a.radius_miles).toFixed(1)}"`
    + ` fill="var(--m-ring)" fill-opacity=".08" stroke="var(--m-ring)" stroke-width="1.4" stroke-dasharray="6 5">`
    + `<title>${esc(a.name||a.id)} · ${a.radius_miles} mile reach · `
    + `${a.headroom_mw==null?"headroom unmeasured":"up to "+fx(a.headroom_mw,1)+" MW unused"}</title></circle>`));
  out.push(`</g><g data-l="tower">`);
  m.towers.forEach((t,i) => out.push(
    `<circle class="hit" data-k="tower" data-i="${i}" cx="${P.x(t.lon).toFixed(1)}" cy="${P.y(t.lat).toFixed(1)}"`
    + ` r="1.8" fill="var(--m-tower)" fill-opacity=".85">`
    + `<title>${esc(t.licensee||"licensee not published")} · ${esc(t.kind||"structure")}`
    + `${t.height_ft?" · "+Math.round(t.height_ft)+" ft":""}</title></circle>`));
  out.push(`</g><g data-l="pop">`);
  m.pops.forEach((p,i) => out.push(
    `<rect class="hit" data-k="pop" data-i="${i}" x="${(P.x(p.lon)-3.5).toFixed(1)}"`
    + ` y="${(P.y(p.lat)-3.5).toFixed(1)}" width="7" height="7"`
    + ` fill="var(--m-pop)" stroke="var(--panel)" stroke-width="1.2">`
    + `<title>${esc(p.name||"carrier point of presence")}${p.dwdm?" · DWDM transport":""}`
    + `${p.bw?" · "+esc(p.bw):""}</title></rect>`));
  out.push(`</g><g data-l="anchor">`);
  m.anchors.forEach((a,i) => out.push(
    `<path class="hit" data-k="anchor" data-i="${i}" d="M${P.x(a.lon).toFixed(1)} ${(P.y(a.lat)-6).toFixed(1)}`
    + `l6 6l-6 6l-6-6Z" fill="var(--m-ring)"`
    + ` stroke="var(--panel)" stroke-width="1.2"><title>${esc(a.name||a.id)} · generation anchor</title></path>`));
  out.push(`</g><g data-l="solar">`);
  (m.solar_hosts || []).forEach((h,i) => out.push(
    `<g class="hit solar" data-k="solar" data-i="${i}"><path d="M${P.x(h.lon).toFixed(1)} ${(P.y(h.lat)-6).toFixed(1)}l6 10.4h-12Z" fill="var(--m-solar)"`
    + ` stroke="var(--panel)" stroke-width="1.2"><title>#${h.rank} ${esc(h.name||h.id)} · solar farm host · `
    + `${fx(h.solar_mw,1)} MW solar${h.operator?" · "+esc(h.operator):""}${h.county?" · "+esc(h.county)+" County":""}</title></path></g>`));
  if (Array.isArray(m.colocation_hosts)){
    out.push(`</g><g data-l="host">`);
    m.colocation_hosts.forEach((h,i) => { if (!h.has_coords || h.lat == null || h.lon == null) return;
      out.push(`<g class="hit host" data-k="host" data-i="${i}" data-p="${esc(h.posture||"UNKNOWN")}">`
        + `<path d="${hexD(P.x(h.lon), P.y(h.lat), 6.5)}" ${hostPaint(h.posture)} stroke-width="1.6"/>`
        + `<title>${esc(h.host_name||h.id)} · colocation host · ${esc(h.posture||"UNKNOWN")}`
        + `${h.host_fuel?" · "+esc(h.host_fuel):""}${h.host_spare_mw==null?"":" · "+fx(h.host_spare_mw,1)+" MW spare"}`
        + ` — double click for the record and its evidence</title></g>`); });
  }
  if (Array.isArray(m.brownfield)){
    out.push(`</g><g data-l="brown">`);
    m.brownfield.forEach((b,i) => { if (b.lat == null || b.lon == null) return;
      const L = bfLeg(m, b.type), idle = bfIdle(b);
      out.push(`<g class="hit brown" data-k="brown" data-i="${i}" data-a="${idle?"idle":"unknown"}">`
        + bfMark(L.marker, P.x(b.lon), P.y(b.lat), idle)
        + `<title>${esc(b.name||b.id)} · ${esc(L.label)} · ${idle?"idle evidence":"availability UNKNOWN"}`
        + ` — double click for the record</title></g>`); });
  }
  if (facRows(m)){
    out.push(`</g><g data-l="fac">`);
    facRows(m).forEach((f,i) => { if (f.lat == null || f.lon == null) return;
      out.push(`<g class="hit fac" data-k="fac" data-i="${i}" data-s="${esc(f.status||"UNKNOWN")}">`
        + facMark(f, P.x(f.lon), P.y(f.lat))
        + `<title>${esc(f.name||f.operator||"unnamed facility")} · ${esc(facLabel(m, f.kind))} · ${esc(f.status||"UNKNOWN")}`
        + ` — double click for the record</title></g>`); });
  }
  out.push(`</g><g data-l="site">`);
  m.finalists.forEach((f,i) => {
    const x = P.x(f.lon).toFixed(1), y = P.y(f.lat).toFixed(1);
    out.push(`<g class="hit site" data-k="site" data-i="${i}">`
      + `<circle cx="${x}" cy="${y}" r="9" fill="var(--m-site)" stroke="var(--panel)" stroke-width="1.8"/>`
      + `<text class="mn" x="${x}" y="${(+y+3).toFixed(1)}" text-anchor="middle">${f.rank}</text>`
      + `<title>#${f.rank} · ${f.apn?"APN "+esc(f.apn):"parcel"} · ${f.acres==null?"acres unknown":fx(f.acres,1)+" ac"}`
      + ` · score ${fx(f.score,3)}${f.city?" · "+esc(f.city):""}`
      + `${f.comms_grade==null?"":" · comms grade "+f.comms_grade}${f.pop?" off "+esc(f.pop):""}`
      + `${f.unknown_doors && f.unknown_doors.length ? " · verify on field work: " + esc(f.unknown_doors.join(", ").replace(/_/g," ")) : ""}`
      + ` — double click for the full record</title></g>`);
  });
  out.push("</g></svg>");
  const planned2 = m.fiber.filter(f => !/complete/i.test(f.status||"")).length;
  const bar = [
    ["site",   "sites",              m.finalists.length],
    ["anchor", "anchors",            m.anchors.length],
    ["solar",  "solar farm hosts",   (m.solar_hosts||[]).length],
    ...(Array.isArray(m.colocation_hosts) ? [["host", "colocation hosts", hostsDrawn(m)]] : []),
    ...(Array.isArray(m.brownfield) ? [["brown", "brownfield sites", m.brownfield.filter(b => b.lat != null && b.lon != null).length]] : []),
    ...(facRows(m) ? [["fac", "data centers & mines", facRows(m).filter(f => f.lat != null && f.lon != null).length]] : []),
    ["ring",  "anchor reach",       m.anchors.length],
    ["fiber",  "fiber",              m.fiber.length],
    ["fplan",  "fiber, planned",     planned2],
    ["power",  "transmission",       m.power.length],
    ["pop",    "carrier PoPs",       m.pops.length],
    ["tower",  "structures",         m.towers.length]
  ].map(([k,t,n]) =>
    `<label class="lchk"><input type="checkbox" data-l="${k}" checked>`
    + `<span>${esc(t)}<b>${num(n)}</b></span></label>`).join("");
  const hv = m.power.filter(l => l.kv != null && l.kv >= 345).length;
  const planned = m.fiber.filter(f => !/complete/i.test(f.status||"")).length;
  const ring = m.anchors.length ? m.anchors[0].radius_miles : 5;
  const leg = [
    [`<i class="ci" style="background:var(--m-site)"></i>`, `ranked site (${m.finalists.length})`],
    [`<i class="dm" style="background:var(--m-ring)"></i>`, `generation anchor (${m.anchors.length})`],
    [`<i class="tr" style="border-bottom-color:var(--m-solar)"></i>`, `solar farm host, the plant is the site (${(m.solar_hosts||[]).length})`],
    ...(Array.isArray(m.colocation_hosts) ? hostLegend(m) : []),
    ...(Array.isArray(m.brownfield) ? bfLegend(m) : []),
    ...(facRows(m) ? facLegend(m) : []),
    [`<i style="border-color:var(--m-ring);border-top-style:dashed"></i>`, `${ring} mile anchor reach`],
    [`<i style="border-color:var(--m-fiber);border-top-width:3px"></i>`, `fiber route, completed (${m.fiber.length - planned})`],
    [`<i style="border-color:var(--m-fiber-plan);border-top-style:dashed"></i>`, `fiber route, planned or building (${planned})`],
    [`<i style="border-color:var(--m-power-hv);border-top-width:3px"></i>`, `transmission line, 345 kV and up (${hv})`],
    [`<i style="border-color:var(--m-power)"></i>`, `transmission line, below 345 kV (${m.power.length - hv})`],
    [`<i class="sq" style="background:var(--m-pop)"></i>`, `carrier PoP (${m.pops.length})`],
    [`<i class="ci" style="background:var(--m-tower);width:6px;height:6px"></i>`, `licensed structure (${m.towers.length})`]
  ].map(([sw,t]) => `<span class="k">${sw}${esc(t)}</span>`).join("");
  const notes = [m.fiber_note, m.pops_note].filter(Boolean)
    .map(n => `<p class="mapnote">${esc(n)}</p>`).join("");
  return `<section><h2>Where they are</h2>
    <p class="dim" style="font-size:13.5px">Drawn from measured geometry, not a tile service: the published page loads no
    external map, so the outline is the same US Census state ring the search bounds came from and every other mark is
    a public record shipped with the page. Hover any mark for its source values.</p>
    <div class="lbar">${bar}</div>
    <div class="mapgrid"><div class="mapbox" id="mapbox">${out.join("")}</div>
    <div class="mlegend"><span class="lh">Legend</span>${leg}</div></div>
    <div class="mdetail" id="mdetail"><p class="dim" style="margin:0;font-size:13px">Double click any mark
      — a site, an anchor, a PoP, a structure, a fiber or transmission line — to pull its record up here.
      A green site disc pulls every field stored for that parcel, its anchor, and the nearest drawn
      fiber, transmission line, PoP and structure.</p></div>
    ${notes}
    <p class="dim" style="font-size:12.5px;margin-top:8px">Transmission lines and structures are drawn across the whole
    map extent, so lines entering from a neighbouring state appear. Only the sites, anchors and rings are filed to
    ${esc(m.state)}.</p></section>`;
}


/* ---------- geodesy, so a click can name what is nearest ----------
   Straight line, not a route. Everything on this map is drawn geometry, so the
   distance to a line is measured to its nearest DRAWN VERTEX: a long segment
   between two vertices can pass closer than the vertex does. Labelled as such
   on the card rather than presented as a survey. */
function hav(la1, lo1, la2, lo2){
  const r = x => x*Math.PI/180, R = 3958.7613;
  const dla = r(la2-la1), dlo = r(lo2-lo1);
  const a = Math.sin(dla/2)**2 + Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function nearPt(list, lat, lon){
  let best = null, bd = Infinity;
  (list||[]).forEach((p,i) => { const d = hav(lat, lon, p.lat, p.lon);
    if (d < bd){ bd = d; best = {o:p, i:i, mi:d}; } });
  return best;
}
function nearPath(list, lat, lon){
  let best = null, bd = Infinity;
  (list||[]).forEach((l,i) => (l.path||[]).forEach(v => {
    const d = hav(lat, lon, v[1], v[0]);
    if (d < bd){ bd = d; best = {o:l, i:i, mi:d}; } }));
  return best;
}
const dmi = d => d == null ? null : d < 0.1 ? Math.round(d*5280) + " ft" : fx(d,2) + " mi";

/* Fields the curated card already names, so the catch-all below does not
   repeat them. Anything NOT in this list is shown verbatim: a field added to
   the pipeline later appears on the card without this page being touched. */
const SHOWN = new Set(["rank","apn","owner","acres","zoning","city","jurisdiction",
  "lat","lon","score","cut","anchor_id","anchor_ft","anchor_fuel","anchor_headroom_mw",
  "headroom_mw","fiber_ft","fiber_mi","comms_grade","pop", ...HOST_KEYS]);
function autoVal(k, v){
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "boolean") return v ? "yes" : "no";
  if (Array.isArray(v)) return v.length + " value" + (v.length===1?"":"s");
  if (typeof v === "object") return JSON.stringify(v);
  if (typeof v === "number"){
    if (/_ft$/.test(k)) return dist(v);
    if (/_mi$/.test(k)) return fx(v,2) + " mi";
    if (/_mw$/.test(k)) return fx(v,3) + " MW";
    return Number.isInteger(v) ? num(v) : fx(v,4);
  }
  return String(v);
}
function restRows(obj){
  return Object.keys(obj).filter(k => !SHOWN.has(k))
    .sort().map(k => [titl(k), autoVal(k, obj[k])]);
}
const sub = t => `<div class="lab" style="margin:16px 0 6px">${esc(t)}</div>`;
/* Every card ends with the sources it came from as live links, so a double
   click always leads back to the publisher, never to this page's word for it. */
function srcLinks(list){
  const ok = list.filter(x => x && x[1] && /^https?:\/\//.test(x[1]));
  if (!ok.length) return "";
  return sub("Sources") + `<ul class="srcl">` + ok.map(([t,u]) =>
    `<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a></li>`).join("") + `</ul>`;
}
/* The publisher's own row for one mark: an ArcGIS query at that point, answered
   as the publisher's HTML record page. Nothing is re-typed from this page. */
function recQ(url, lat, lon, meters){
  if (!url || !/^https?:\/\//.test(url) || lat == null || lon == null) return null;
  const base = url.replace(/\/query\/?$/, "") + "/query";
  return base + "?where=1%3D1&geometry=" + lon + "," + lat
    + "&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects"
    + (meters ? "&distance=" + meters + "&units=esriSRUnit_Meter" : "")
    + "&outFields=*&returnGeometry=false&f=html";
}
const midV = path => (path && path.length) ? path[Math.floor(path.length/2)] : null;
const ANCHOR_SHOWN = new Set(["id","name","fuel","nameplate_mw","headroom_mw","spare_mw","retired_mw",
  "operator","balancing_authority","county","state","radius_miles","finalists","lat","lon",
  "carbon_free","curtailed","source_url","plant_url","evidence_tier","distance_mi",
  "generators","headroom_by_type","monthly", ...HOST_KEYS]);

/* ---------- what an anchor actually generates (rhyolitegeo 5985bf9) ----------
   `monthly` is EIA-923 net MWh per prime mover on one shared 24-month axis;
   MWh / hours is the month's average MW. null = not filed, drawn as a gap and
   never as zero. Storage files net consumption: drawn, but never headroom. */
const STORAGE_PM = new Set(["BA","ES","FW","PS","CE"]);
const GEN_COLORS = ["--viridian","--m-power","--m-ring","--m-pop","--m-fiber","--m-solar","--m-site","--amber"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monLab = ym => { const [y,mo] = String(ym).split("-"); return (MON[+mo-1] || mo) + " '" + String(y).slice(2); };
const serName = s => (s.technology || "prime mover " + s.prime_mover) + " (" + s.prime_mover + ")";
function niceStep(span){
  const raw = span / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function genChartHtml(mo){
  if (!mo || !Array.isArray(mo.months) || !mo.months.length || !Array.isArray(mo.series)) return "";
  const N = mo.months.length, hrs = mo.hours || [];
  const ser = mo.series.map((s,k) => ({
    s, color: `var(${GEN_COLORS[k % GEN_COLORS.length]})`,
    avg: (s.mwh || []).map((v,j) => v == null || !hrs[j] ? null : v / hrs[j])
  }));
  const vals = [];
  ser.forEach(o => { o.avg.forEach(v => { if (v != null) vals.push(v); });
                     if (o.s.nameplate_mw != null) vals.push(o.s.nameplate_mw); });
  if (!vals.length) return sub("Monthly generation") + kv([["average MW by month", null]]);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const step = niceStep(hi - lo);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const W = 600, H = 250, L = 54, R = 12, T = 12, B = 40;
  const X = j => L + (N === 1 ? (W-L-R)/2 : j * (W-L-R) / (N-1));
  const Y = v => T + (hi - v) * (H-T-B) / (hi - lo);
  const o = [`<svg class="genchart" viewBox="0 0 ${W} ${H}" width="100%" role="img"
    aria-label="Average MW per month by technology against nameplate, ${esc(mo.months[0])} to ${esc(mo.months[N-1])}">`];
  for (let v = lo; v <= hi + step/1e6; v += step){
    o.push(`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--rule)" stroke-width="${Math.abs(v)<1e-9?1.4:0.8}"/>`
      + `<text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)">${esc(+v.toFixed(3))}</text>`);
  }
  for (let j = 0; j < N; j += 3)
    o.push(`<line x1="${X(j).toFixed(1)}" x2="${X(j).toFixed(1)}" y1="${H-B}" y2="${H-B+4}" stroke="var(--faint)"/>`
      + `<text x="${X(j).toFixed(1)}" y="${H-B+17}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(monLab(mo.months[j]))}</text>`);
  o.push(`<text x="14" y="${((T+H-B)/2).toFixed(1)}" transform="rotate(-90 14 ${((T+H-B)/2).toFixed(1)})" text-anchor="middle" font-size="12" fill="var(--muted)">average MW</text>`
    + `<text x="${((L+W-R)/2).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="12" fill="var(--muted)">month (EIA-923)</text>`);
  ser.forEach(q => {
    if (q.s.nameplate_mw != null)
      o.push(`<line x1="${L}" x2="${W-R}" y1="${Y(q.s.nameplate_mw).toFixed(1)}" y2="${Y(q.s.nameplate_mw).toFixed(1)}" stroke="${q.color}" stroke-width="1.3" stroke-dasharray="6 4"><title>${esc(serName(q.s))} nameplate ${esc(fx(q.s.nameplate_mw,1))} MW</title></line>`);
    let d = "", pen = false;
    q.avg.forEach((v,j) => { if (v == null){ pen = false; return; }
      d += (pen ? "L" : "M") + X(j).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });
    if (d) o.push(`<path d="${d}" fill="none" stroke="${q.color}" stroke-width="2" stroke-linejoin="round"/>`);
    q.avg.forEach((v,j) => { if (v != null) o.push(`<circle cx="${X(j).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.2" fill="${q.color}"><title>${esc(serName(q.s))} · ${esc(mo.months[j])} · ${esc(fx(v,1))} MW avg</title></circle>`); });
  });
  o.push(`</svg>`);
  const legend = `<div class="genleg">` + ser.map(q =>
    `<span><i style="background:${q.color}"></i>${esc(serName(q.s))}${STORAGE_PM.has(q.s.prime_mover) ? " · storage" : ""}`
    + ` <i class="np" style="border-color:${q.color}"></i>nameplate ${q.s.nameplate_mw == null ? "not published" : esc(fx(q.s.nameplate_mw,1)) + " MW"}`
    + (q.avg.some(v => v == null) ? ` · ${q.avg.filter(v => v == null).length} month(s) not filed` : "") + `</span>`).join("") + `</div>`;
  return sub("Monthly generation, average MW") + o.join("") + legend;
}
function headroomHtml(rows){
  if (!Array.isArray(rows) || !rows.length) return "";
  const none = `<span class="unk">no EIA-923 data</span>`;
  const mwc = v => v == null ? none : esc(fx(v,1));
  const body = rows.map(h => {
    const all = h.prime_mover === "ALL", sto = STORAGE_PM.has(h.prime_mover);
    const name = all ? "plant, generating only" : (h.technologies || "prime mover " + h.prime_mover) + " (" + h.prime_mover + ")";
    const cf = h.capacity_factor == null ? none : esc(fx(h.capacity_factor * 100, 1)) + "%";
    const hr = sto ? [`<span class="unk">storage, not counted</span>`, `<span class="unk">storage, not counted</span>`]
                   : [mwc(h.headroom_mw), mwc(h.headroom_avg_mw)];
    return `<tr${all ? ' style="font-weight:600"' : ""}><td>${esc(name)}</td>`
      + `<td class="n">${h.nameplate_mw == null ? '<span class="unk">not published</span>' : esc(fx(h.nameplate_mw,1))}</td>`
      + `<td class="n">${cf}</td><td class="n">${hr[0]}</td><td class="n">${hr[1]}</td>`
      + `<td class="n">${h.data_year == null ? "" : esc(h.data_year)}</td></tr>`;
  }).join("");
  return sub("Headroom by technology") + `<div class="scroll"><table class="gentbl"><thead><tr><th>technology</th>`
    + `<th>nameplate MW</th><th>capacity factor</th><th>headroom MW, peak month</th><th>headroom MW, annual avg</th><th>year</th>`
    + `</tr></thead><tbody>${body}</tbody></table></div>`;
}
function generatorsHtml(gens){
  if (!Array.isArray(gens) || !gens.length) return "";
  const c = v => v == null || v === "" ? '<span class="unk">—</span>' : esc(v);
  const body = gens.map(g => `<tr><td class="n">${c(g.id)}</td><td>${c(g.technology)}</td><td>${c(g.prime_mover)}</td>`
    + `<td class="n">${g.nameplate_mw == null ? c(null) : esc(fx(g.nameplate_mw,1))}</td>`
    + `<td>${c(g.status)}${g.sheet && g.sheet !== "Operable" ? " · " + esc(g.sheet) : ""}</td><td class="n">${c(g.operating_year)}</td></tr>`).join("");
  return sub(`Generators (${gens.length})`) + `<div class="scroll"><table class="gentbl"><thead><tr><th>id</th><th>technology</th>`
    + `<th>prime mover</th><th>MW</th><th>status</th><th>operating year</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- the record behind a mark ----------
   Double click pulls up the stored values for that object and names the
   publisher they came from. A field the source does not publish says so; it is
   never dropped from the card and never shown as a zero. */
function kv(rows){
  // A publisher's empty cell arrives as null, "" or, in at least one PoP
  // inventory, a single space. All three mean the same thing and must read as
  // it, never as a blank line the reader has to interpret.
  // HIFLD's own NOT AVAILABLE sentinel is an empty cell wearing a value's
  // clothes; the voltage column already gets that treatment, the owner column
  // was reading it out as if it were an owner's name.
  const blank = v => v == null
    || (typeof v === "string" && (!v.trim() || /^not available$/i.test(v.trim())));
  return `<dl class="rec">` + rows.filter(Boolean).map(([k,v,cls]) =>
    `<div><dt>${esc(k)}</dt><dd class="${blank(v)?"unk":(cls||"")}">${blank(v)?"not published":esc(String(v).trim())}</dd></div>`
  ).join("") + `</dl>`;
}

function recordHtml(m, kind, i){
  const s = cache[m.region] || {};
  const src = m.sources || {};
  if (kind === "site"){
    const f = m.finalists[i];
    // the summary's own finalist row carries what the map payload leaves out
    // Both lists are ordered by rank, so position is the fallback join when a
    // parcel has no APN. A wrong join would show another parcel's owner.
    const sf = s.finalists || [];
    const b = (f.apn ? sf.find(r => r.apn === f.apn) : null) || sf[i] || {};
    const all = Object.assign({}, b, f);          // map payload wins on overlap
    const A = (m.anchors || []).find(a => a.id === f.anchor_id) || {};
    const wm = (s.metrics || {}).weight_measured || 0;
    // nearest drawn marks: measured here, not published on the parcel row
    const np = nearPt(m.pops, f.lat, f.lon), nt = nearPt(m.towers, f.lat, f.lon);
    const nf = nearPath(m.fiber, f.lat, f.lon), nl = nearPath(m.power, f.lat, f.lon);
    const namedPop = (m.pops || []).find(p => p.name === f.pop);
    const pop = namedPop || (np && np.o) || {};
    const popMi = namedPop ? hav(f.lat, f.lon, namedPop.lat, namedPop.lon) : (np && np.mi);
    const extra = restRows(all);
    return `<h3>#${f.rank} · ${f.apn ? "APN " + esc(f.apn) : "ranked parcel"}`
      + `${b.owner ? " · " + esc(b.owner) : ""}</h3>`
      + sub("Parcel") + kv([
        ["rank", f.rank + " of " + sf.length + " finalists"],
        ["disposition", b.cut],
        ["score", fx(f.score,3) + " of " + fx(wm,2) + " instrumented"],
        ["measured score", f.measured_score == null ? null : fx(f.measured_score,3) + (f.measured_covered == null ? "" : " on " + Math.round(100*f.measured_covered) + "% of weight measured")],
        ["verify on field work", f.unknown_doors && f.unknown_doors.length ? f.unknown_doors.join(", ").replace(/_/g," ") : null],
        ["APN", f.apn],
        ["owner", b.owner],
        ["acres", f.acres == null ? null : fx(f.acres,1)],
        ["zoning", b.zoning],
        ["city", f.city],
        ["county layer", f.jurisdiction],
        ["coordinates", fx(f.lat,5) + ", " + fx(f.lon,5)]
      ])
      + sub("Generation anchor") + kv([
        ["plant id", f.anchor_id],
        ["plant name", A.name],
        ["fuel", b.anchor_fuel || A.fuel],
        ["nameplate", A.nameplate_mw == null ? null : fx(A.nameplate_mw,1) + " MW"],
        ["headroom", (f.headroom_mw != null ? f.headroom_mw : A.headroom_mw) == null ? null
          : "up to " + fx(f.headroom_mw != null ? f.headroom_mw : A.headroom_mw,3) + " MW unused"],
        ["distance from parcel", b.anchor_ft == null ? null : dist(b.anchor_ft)],
        ["reach drawn", A.radius_miles == null ? null : A.radius_miles + " miles"],
        ["finalists in that ring", A.finalists == null ? null : String(A.finalists)],
        ["anchor coordinates", A.lat == null ? null : fx(A.lat,5) + ", " + fx(A.lon,5)]
      ])
      + sub("Fiber and comms") + kv([
        ["fiber route", f.fiber_mi == null ? null : fx(f.fiber_mi,2) + " mi"],
        ["fiber route, feet", b.fiber_ft == null ? null : num(Math.round(b.fiber_ft))],
        ["comms grade", f.comms_grade == null ? null : f.comms_grade + " of 6"],
        ["carrier PoP", f.pop || pop.name],
        ["PoP straight line", dmi(popMi)],
        ["PoP DWDM transport", pop.dwdm == null ? null : (pop.dwdm ? "yes" : "not flagged")],
        ["PoP backbone", pop.bw],
        ["nearest drawn fiber", nf ? (nf.o.provider || "provider not published") : null],
        ["that route's status", nf ? nf.o.status : null],
        ["distance to it", nf ? dmi(nf.mi) : null]
      ])
      + sub("Nearest drawn infrastructure") + kv([
        ["transmission owner", nl ? (nl.o.owner || "owner not published") : null],
        ["voltage", nl ? (nl.o.kv == null ? null : nl.o.kv + " kV") : null],
        ["voltage class", nl ? nl.o.vclass : null],
        ["line status", nl ? nl.o.status : null],
        ["distance to that line", nl ? dmi(nl.mi) : null],
        ["licensed structure", nt ? (nt.o.licensee || "licensee not published") : null],
        ["structure type", nt ? nt.o.kind : null],
        ["structure height", nt && nt.o.height_ft ? Math.round(nt.o.height_ft) + " ft" : null],
        ["distance to it", nt ? dmi(nt.mi) : null]
      ])
      + (extra.length ? sub("Every other stored field") + kv(extra) : "")
      + srcLinks([["This parcel's record at the county layer",
                    recQ((m.parcel_sources || {})[f.jurisdiction], f.lat, f.lon, 0)],
                  ["County parcel layer", (m.parcel_sources || {})[f.jurisdiction]],
                  ["EIA plant page for the anchor", A.plant_url],
                  ["EIA-860 annual generator file", A.source_url],
                  ["HIFLD electric power transmission lines", src.power],
                  ["State fiber route inventory", src.fiber],
                  ["State carrier PoP inventory", src.pops],
                  ["FCC antenna structure register", src.towers],
                  ["State outline, Census TIGERweb", src.outline]])
      + `<p class="rsrc">Parcel geometry and attributes from the county cadastre layer named above;
        anchor from EIA-860 nameplate joined to the busiest EIA-923 month; the rest from
        ${esc(src.power || "HIFLD transmission")}, ${esc(src.fiber || "the state fiber route inventory")},
        ${esc(src.pops || "the state PoP inventory")} and the FCC structure register.
        Headroom is a ceiling on spare capacity, not spare capacity: EIA-923 cannot see a PPA.
        Distances to a line are measured to its nearest drawn vertex, straight line, not a route:
        they size the problem, they do not price a build.</p>`;
  }
  if (kind === "anchor"){
    const a = m.anchors[i];
    const mw = v => v == null ? null : fx(v,1) + " MW";
    const extra = Object.keys(a).filter(k => !ANCHOR_SHOWN.has(k)).sort()
      .map(k => [titl(k), autoVal(k, a[k])]);
    return `<h3>${esc(a.name || a.id)}</h3>`
      + sub("Plant") + kv([
        ["plant id", a.id], ["operator", a.operator], ["fuel", a.fuel],
        ["county", a.county], ["state", a.state],
        ["balancing authority", a.balancing_authority],
        ["coordinates", fx(a.lat,5) + ", " + fx(a.lon,5)]
      ])
      + sub("Capacity") + kv([
        ["operating nameplate", mw(a.nameplate_mw)],
        ["retired nameplate", mw(a.retired_mw)],
        ["headroom", a.headroom_mw == null ? null : "up to " + fx(a.headroom_mw,1) + " MW unused"],
        ["spare, confirmed", mw(a.spare_mw)],
        ["curtailed", a.curtailed == null ? null : (a.curtailed ? "yes" : "no")],
        ["carbon free", a.carbon_free == null ? null : (a.carbon_free ? "yes" : "no")]
      ])
      + (a.monthly ? genChartHtml(a.monthly) : "")
      + headroomHtml(a.headroom_by_type)
      + generatorsHtml(a.generators)
      + sub("On this board") + kv([
        ["reach drawn", a.radius_miles == null ? null : a.radius_miles + " miles"],
        ["finalists inside it", a.finalists == null ? null : String(a.finalists)],
        ["evidence tier", a.evidence_tier]
      ])
      + hostHtml(a)
      + (extra.length ? sub("Every other stored field") + kv(extra) : "")
      + srcLinks([["EIA plant page for " + (a.name || a.id), a.plant_url],
                  ["EIA-860 annual generator file (nameplate, fuel, operator)", a.source_url]])
      + `<p class="rsrc">EIA-860 nameplate joined to the busiest EIA-923 month. EIA-923 cannot see a PPA,
      so headroom is the ceiling on spare capacity and never a promise of it. Spare and curtailed need a
      second instrument; not published means nobody has measured them yet.</p>`;
  }
  if (kind === "solar"){
    const h = m.solar_hosts[i];
    const code = String(h.id || "").replace(/^eia-/, "");
    const url = /^\d+$/.test(code) ? "https://www.eia.gov/electricity/data/browser/#/plant/" + code : null;
    return `<h3>${esc(h.name || h.id)}</h3>`
      + sub("Solar farm host") + kv([
        ["rank among hosts", h.rank == null ? null : "#" + h.rank],
        ["plant id", h.id], ["operator", h.operator], ["county", h.county],
        ["solar operable", h.solar_mw == null ? null : fx(h.solar_mw,1) + " MW"],
        ["all operable", h.operable_mw == null ? null : fx(h.operable_mw,1) + " MW"],
        ["coordinates", fx(h.lat,5) + ", " + fx(h.lon,5)]
      ])
      + hostHtml(h)
      + srcLinks([["EIA plant page for " + (h.name || h.id), url],
                  ["EIA-860 annual generator file", "https://www.eia.gov/electricity/data/eia860/"]])
      + `<p class="rsrc">EIA-860 operable generators. A host qualifies when solar is over 30 MW and more
      than half the plant's operable capacity; batteries are excluded. The plant is the site: posture,
      connection, fiber and firming stay unknown until measured.</p>`;
  }
  if (kind === "host"){
    const h = (m.colocation_hosts || [])[i];
    if (!h) return "";
    const code = String(h.id || "").replace(/^eia-/, "");
    const url = /^\d+$/.test(code) ? "https://www.eia.gov/electricity/data/browser/#/plant/" + code : null;
    const U = v => v == null || v === "" ? ["UNKNOWN", "unk"] : [v, ""];
    const row = (k, v) => { const [t, c] = U(v); return [k, t, c]; };
    const extra = Object.keys(h).filter(k => !HOST_KEYS.includes(k) && !["id","lat","lon"].includes(k)).sort()
      .map(k => [titl(k), autoVal(k, h[k])]);
    return `<h3>${esc(h.host_name || h.id)}</h3>`
      + sub("Colocation host") + kv([
        ["asset id", h.id],
        row("host name", h.host_name), row("fuel", h.host_fuel), row("fuel class", h.host_fuel_class),
        row("spare", h.host_spare_mw == null ? null : fx(h.host_spare_mw,1) + " MW"),
        ["coordinates", h.lat == null ? null : fx(h.lat,5) + ", " + fx(h.lon,5)]
      ])
      + hostHtml(h)
      + (extra.length ? sub("Every other stored field") + kv(extra) : "")
      + srcLinks([["EIA plant page for " + (h.host_name || h.id), url]])
      + `<p class="rsrc">Posture from the colocation stage; evidence, fiber route and documents from the
      hostdocs stage, each linked to the document it was read from. PRIMARY means the operator said so;
      INFERRED means it behaves like an operator that would. UNKNOWN is unmeasured, never a no.</p>`;
  }
  if (kind === "brown" || kind === "fac"){
    // UNKNOWN is a value on these cards: an unmeasured field reads UNKNOWN, never blank
    const row = (k, v) => (v == null || v === "") ? [k, "UNKNOWN", "unk"] : [k, v, v === "UNKNOWN" ? "unk" : ""];
    const list = v => { let x = v;
      if (typeof x === "string" && /^\s*\[/.test(x)) { try { x = JSON.parse(x); } catch (e) {} }
      return Array.isArray(x) ? (x.length ? x.join(", ") : null) : x; };
    const lnk = (u, t) => u && /^https?:\/\//.test(u)
      ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>` : "";
    const tier = t => `<span class="t">${esc(t)}</span>`;
    const coords = r => r.lat == null || r.lon == null ? null : fx(r.lat,5) + ", " + fx(r.lon,5);
    const flag = v => v === true ? "yes" : v === false ? "no" : null;
    const noSrc = u => /^https?:\/\//.test(u || "") ? ""
      : `<p class="hev" style="margin:0;font-size:13px">source link <span class="u">UNKNOWN</span>: none recorded on this row</p>`;
    if (kind === "brown"){
      const b = (m.brownfield || [])[i];
      if (!b) return "";
      const L = bfLeg(m, b.type);
      const extra = Object.keys(b).filter(k => !BROWN_KEYS.includes(k)).sort().map(k => [titl(k), autoVal(k, b[k])]);
      return `<h3>${esc(b.name || b.id)}</h3>`
        + sub("Brownfield site") + kv([
          ["site id", b.id], row("name", b.name), row("type", L.label + (b.type ? " (" + b.type + ")" : "")),
          row("city", b.city), row("NAICS", list(b.naics)),
          row("availability", b.availability), row("on a board parcel", flag(b.on_parcel)),
          row("sources", list(b.sources)), row("coordinates", coords(b))
        ])
        + sub("Idle line") + kv([row("closure evidence", b.idle)])
        + (extra.length ? sub("Every other stored field") + kv(extra) : "")
        + srcLinks([["Source record for " + (b.name || b.id), b.source_url]]) + noSrc(b.source_url)
        + `<p class="rsrc">EPA ECHO facility registry and OpenStreetMap, typed by NAICS as cold storage or a
      heavy-power plant. Idle is a sourced fact (ECHO, WARN, OSM or ACRES) or it is availability UNKNOWN;
      UNKNOWN is unmeasured, never operating and never idle.</p>`;
    }
    const f = (facRows(m) || [])[i];
    if (!f) return "";
    const line = f.idle_line || "";
    const conflict = (line.match(/sources conflict: ([^()]+?)\s*\(listed from/) || [])[1];
    const sig = [...line.matchAll(/(peeringdb_[a-z_]+)=(\S+) \(INFERRED\)/g)];
    const srcs = (() => { const x = list(f.sources); return x == null ? "" : String(x); })();
    const pdb = sig.length
      ? `<ul class="srcl hev">` + sig.map(s => `<li>${esc(titl(s[1]))} = ${esc(s[2])}${tier("INFERRED")}</li>`).join("") + `</ul>`
      : `<p class="hev" style="margin:0;font-size:13px">${/PEERINGDB/i.test(srcs)
          ? "listed in PeeringDB; no INFERRED signal on this row" : "not listed in PeeringDB"}${tier("INFERRED")}</p>`;
    const extra = Object.keys(f).filter(k => !FAC_KEYS.includes(k)).sort().map(k => [titl(k), autoVal(k, f[k])]);
    return `<h3>${esc(f.name || f.operator || "unnamed facility")}</h3>`
      + sub(facLabel(m, f.kind)) + kv([
        row("status", f.status), row("status tier", f.status_tier),
        row("candidate", facCand(f) ? "yes, IDLE or CLOSED" : "no, context"),
        row("name", f.name), row("operator", f.operator),
        row("conflict", conflict ? "sources conflict: " + conflict : "none recorded"),
        row("sources", list(f.sources)),
        row("retrieved", f.retrieved_at ? String(f.retrieved_at).slice(0,10) : null),
        row("parcel match", f.parcel_match),
        f.mw == null ? null : ["MW", fx(f.mw,1) + " MW"], f.sqft == null ? null : ["floor area", num(f.sqft) + " sq ft"],
        row("coordinates", coords(f))
      ])
      + sub("Status line") + kv([row("status and its source", f.idle_line)])
      + sub("PeeringDB signal") + pdb
      + (extra.length ? sub("Every other stored field") + kv(extra) : "")
      + srcLinks([["Source record" + (f.retrieved_at ? ", retrieved " + String(f.retrieved_at).slice(0,10) : ""), f.source_url]])
      + noSrc(f.source_url)
      + `<p class="rsrc">OpenStreetMap and PeeringDB, deduplicated. Status rests on a PRIMARY fact or it is
      UNKNOWN, and contradicting sources read UNKNOWN. PeeringDB with zero networks is only a signal: an
      enterprise room lists none and is full.</p>`;
  }
  if (kind === "pop"){
    const p = m.pops[i];
    return `<h3>${esc(p.name || "carrier point of presence")}</h3>` + kv([
      ["DWDM transport", p.dwdm ? "yes" : "not flagged"],
      ["backbone bandwidth", p.bw],
      ["coordinates", fx(p.lat,5) + ", " + fx(p.lon,5)]
    ]) + srcLinks([["This PoP's record at the publisher", recQ(src.pops_url, p.lat, p.lon, 30)],
      ["State carrier PoP inventory, " + (src.pops || "publisher"), src.pops_url]]) + `<p class="rsrc">${esc(src.pops || "state carrier PoP inventory")}. A building with transport gear in
      it is not a lit circuit at a property line.</p>`;
  }
  if (kind === "tower"){
    const t = m.towers[i];
    return `<h3>${esc(t.licensee || "licensed antenna structure")}</h3>` + kv([
      ["structure type", t.kind],
      ["height", t.height_ft ? Math.round(t.height_ft) + " ft" : null],
      ["city", t.city], ["state", t.state],
      ["coordinates", fx(t.lat,5) + ", " + fx(t.lon,5)]
    ]) + srcLinks([["This structure's FCC record (call sign, registration)", recQ(src.towers, t.lat, t.lon, 30)],
      ["FCC antenna structure register (ArcGIS layer)", src.towers],
      ["FCC ASR search", "https://wireless2.fcc.gov/UlsApp/AsrSearch/asrRegistrationSearch.jsp"]]) + `<p class="rsrc">FCC licensed structure record, republished on ArcGIS and checked annually. An archive
      can overstate what still stands; it can never prove absence.</p>`;
  }
  if (kind === "fiber"){
    const f = m.fiber[i];
    return `<h3>${esc(f.provider || "fiber route")}</h3>` + kv([
      ["status", f.status], ["vertices drawn", String(f.path.length)]
    ]) + srcLinks([["This route's record at the publisher", (v => v && recQ(src.fiber, v[1], v[0], 25))(midV(f.path))],
      ["State fiber route inventory", src.fiber]]) + `<p class="rsrc">State fiber route inventory. A route names whose trench it is, not who is lit at the
      property line, and a second route on the map is not a second path.</p>`;
  }
  if (kind === "power"){
    const l = m.power[i];
    return `<h3>${esc(l.owner || "transmission line")}</h3>` + kv([
      ["voltage", l.kv == null ? null : l.kv + " kV"],
      ["voltage class", l.vclass], ["status", l.status],
      ["vertices drawn", String(l.path.length)]
    ]) + srcLinks([["This line's HIFLD record (owner, voltage, source, validation date)", (v => v && recQ(src.power, v[1], v[0], 25))(midV(l.path))],
      ["HIFLD electric power transmission lines", src.power]]) + `<p class="rsrc">HIFLD electric power transmission lines. HIFLD's own not-available voltage sentinel is
      carried through as not published; a line of unknown voltage is not a low-voltage line.</p>`;
  }
  return "";
}

function pickMark(e){
  const hit = e.target.closest ? e.target.closest(".hit") : null;
  if (!hit) return;
  const m = mapCache[el("region").value];
  const slot = el("mdetail");
  if (!m || !slot) return;
  document.querySelectorAll(".hit.on").forEach(n => n.classList.remove("on"));
  hit.classList.add("on");
  slot.innerHTML = recordHtml(m, hit.getAttribute("data-k"), +hit.getAttribute("data-i"));
  slot.classList.add("open");
  if (slot.scrollIntoView) slot.scrollIntoView({block:"nearest", behavior:"smooth"});
}

function loadMap(reg){
  const slot = el("mapslot");
  if (!slot || !MAPPED.has(reg.id)) return;
  if (mapCache[reg.id]) { slot.innerHTML = mapHtml(mapCache[reg.id]); return; }
  slot.innerHTML = `<p class="dim">Drawing ${esc(reg.name)}…</p>`;
  window.__BOARD_MAP__ = data => { mapCache[data.region] = data;
    if (el("region").value === data.region && el("mapslot")) el("mapslot").innerHTML = mapHtml(data); };
  const sc = document.createElement("script");
  sc.src = "maps/" + reg.id + ".js";
  sc.onerror = () => { if (el("mapslot")) el("mapslot").innerHTML =
    `<p class="mapnote">maps/${esc(reg.id)}.js did not load, so no map is drawn. Reporting that rather than an empty state.</p>`; };
  document.head.appendChild(sc);
}

function notRunHtml(reg){
  const why = reg.status === "empty"
    ? `Every layer this state publishes was measured and none of them is a cadastre that can be keyed to a parcel &mdash;
       paved surfaces, a locator, a residential boundary. There is nothing to rank until a keyable parcel layer exists.`
    : `The endpoints are measured and admitted, but this region has never been run. This page will not show you an
       empty board for it: an empty board and an unrun state look identical and mean opposite things.`;
  return `<div class="notrun"><h2>${reg.status === "empty" ? "No cadastre to rank" : "Not yet run"}</h2>
    <p>${why}</p>
    ${reg.status === "ready" ? `<p class="dim" style="font-size:13.5px;margin-bottom:0">Selecting it is a request for a run. The run is the five stages every ranked region went through:</p>
    <div class="ask">python3 search/harness.py --db search/sites.db ingest --region ${esc(reg.id)} --limit 20000 --skip-unfloored
python3 search/harness.py --db search/sites.db greenfield  --region ${esc(reg.id)}
python3 search/harness.py --db search/sites.db colocation  --region ${esc(reg.id)}
python3 search/harness.py --db search/sites.db screen      --region ${esc(reg.id)} --limit 8000
python3 search/harness.py --db search/sites.db score       --region ${esc(reg.id)}
python3 search/harness.py --db search/sites.db rank        --region ${esc(reg.id)}</div>` : ""}
    </div>`;
}

/* ---------- loading ---------- */
let VIEW = "board";

/* ---------- what the search runs on ----------
   The board says what came out. This says what went in: the floors a parcel
   has to clear to be looked at at all, the screens that can end it outright,
   and the weight behind every metric that grades it. Every number is read from
   criteria.js, which is exported from the same scoring.json and region config
   the run itself used. */
function criteriaHtml(reg, s){
  const c = CRIT[reg.id];
  if (!c) return `<div class="notrun"><h2>No criteria file</h2><p>criteria.js carries no entry for
    <span class="mono">${esc(reg.id)}</span>, so nothing is stated here. An invented criterion would be
    worse than a missing page.</p></div>`;
  const g = c.gates || {};
  const ran = s && s.metrics ? s.metrics.rows : null;
  const measured = {};
  (ran || []).forEach(r => measured[r.metric] = r);

  const cards = [
    ["acre floor", fx(c.min_acres,1) + " ac", "a parcel under this is never ingested"],
    ["anchor reach", fx(c.max_miles,1) + " mi", "straight line from a declared generation anchor"],
    ["finalists kept", num(g.finalist_count), "the board is the top N, not everything that passed"],
    ["weight covered", fx(g.min_weight_covered,2), "of 1.00 declared weight, or it is not a finalist"],
    ["score bar", fx(g.min_weighted_score,2), "weighted score a finalist must clear"],
    ["near miss", fx(g.near_miss_score,2), "banded, not discarded"]
  ].map(([k,v,t]) => `<div><span class="lab">${esc(k)}</span><b>${esc(v)}</b>
    <span class="dim" style="font-size:12px">${esc(t)}</span></div>`).join("");

  const entry = [
    `A parcel record from a county cadastre layer that was measured and admitted — ${num(c.jurisdictions)}
     of them here, with ${num(c.excluded)} publishers excluded for a named reason. A layer that cannot be
     keyed to a parcel is not a cadastre and contributes nothing.`,
    `At least <b>${fx(c.min_acres,1)} acres</b>. ${esc(c.min_acres_source || "")}`,
    `Within <b>${fx(c.max_miles,1)} miles</b> of one of the ${num(c.anchors_declared)} generation anchors
     declared for this region. Outside every ring the parcel is not scored low, it is not in the universe.`,
    `Privately owned. Public land is a different legal universe and is dropped rather than graded.`,
    `Land class ${c.land_classes.map(x=>"<span class='mono'>"+esc(x.toLowerCase())+"</span>").join(" or ")},
     or unknown. Unknown is admitted and recorded as unknown; it is never counted as a pass.`,
    `Inside the region bounds, which come from ${esc(c.bounds_source || "the state geometry")}. A bounding
     box is not a state, so the drawn outline does the containing.`
  ].map(t => `<li style="margin:5px 0">${t}</li>`).join("");

  const scr = (s && s.screens && s.screens.rows.length)
    ? `<div class="scroll"><table><thead><tr><th>screen</th><th>pass</th><th>fail</th><th>unknown</th></tr></thead><tbody>`
      + s.screens.rows.map(r => `<tr><td class="mono">${esc(r.screen)}</td>`
        + ["PASS","FAIL","UNKNOWN"].map(k =>
          `<td class="n${r.results[k]?"":" zero"}">${r.results[k]?num(r.results[k]):"—"}</td>`).join("")
        + `</tr>`).join("")
      + `</tbody></table></div>`
    : `<p class="dim">This region has not been run, so no screen has counts yet.</p>`;

  const mets = c.metrics.map(m => {
    const r = measured[m.metric];
    const cov = r ? `${num(r.measured)} / ${num(r.of)} scored` : "not run here";
    const lad = m.ladder.map(([k,t]) => `<li><span>${k}</span>${esc(t)}</li>`).join("");
    return `<details><summary><b>${fx(m.weight,2)}</b> &nbsp;${esc(titl(m.metric))}
      <span class="dim">&nbsp;· ${esc(cov)}${r && !r.measured ? " · unmeasured, contributes nothing" : ""}</span></summary>
      <p class="dim" style="font-size:13px;margin:6px 0 2px">${esc(m.comment||"")}</p>
      <ul class="lad">${lad}</ul></details>`;
  }).join("");

  // the MW question, answered from the code rather than from memory
  const hr = (s && s.anchors ? s.anchors : []).map(a => a.headroom_mw).filter(v => v != null).sort((a,b)=>a-b);
  const ladder = (c.metrics.find(m => m.metric === "power_headroom") || {ladder:[]}).ladder;
  const mw = `<h3>Megawatts: what is a filter and what is not</h3>
    <p style="font-size:13.5px">Nothing in this search admits or rejects a parcel on megawatts. There is no
    MW range and no MW floor anywhere in the pipeline. The MW figures on these pages are two grading ladders
    and one measurement, and they are easy to read as a range because they sit next to each other.</p>
    <ul style="font-size:13.5px;padding-left:18px">
      <li style="margin:5px 0"><b>The grading ladder</b> for <span class="mono">power_headroom</span>,
        weight ${fx((c.metrics.find(m=>m.metric==="power_headroom")||{}).weight,2)} — the heaviest single metric.
        ${ladder.map(([k,t]) => `Grade ${k}: ${esc(t)}`).join(" ")} Those MW figures decide a
        <em>grade</em> out of ${(c.scale||{}).max || 10}. They decide nothing about admission.</li>
      <li style="margin:5px 0"><b>The spare-capacity bands</b> for a colocation host,
        <span class="mono">${c.spare_mw_floors.map(v=>fx(v,1)).join(" · ")}</span> MW. These grade a host
        where an operator or utility record says what is going spare. No such record has been obtained, so
        <span class="mono">spare_mw</span> is null everywhere by design and these bands are not in play.</li>
      ${(st => st ? `<li style="margin:5px 0"><b>The one MW floor: ${esc(st.label)}</b>. ${esc(st.rule)}.
        It admits a <em>solar farm</em> as its own site type (read from ${esc(st.floor_source||"scoring.json")}); it never
        admits or rejects a parcel.</li>` : "")(solarType(s||{}))}
      <li style="margin:5px 0"><b>Headroom on a site card</b> is a measurement, not a band: EIA-860 nameplate
        minus the plant's busiest EIA-923 month.
        ${hr.length ? `On this region's ${hr.length} carrying anchors it runs ${fx(hr[0],2)} to
          ${fx(hr[hr.length-1],2)} MW.` : ""}
        It is a <em>ceiling</em> on unused capability, not spare capacity: a monthly mean cannot see an hourly
        peak, and no public filing can see a power purchase agreement.</li>
    </ul>
    <p class="dim" style="font-size:13px">So a 1 MW figure and a 15 MW figure are not the ends of a search
    range. The first is a rung on the grading ladder; the second is one anchor's headroom. The 30 MW node size
    in the corridor work is a target for the build, and it has never been a screen in this search.</p>`;

  const cmds = `python3 search/harness.py --db search/sites.db ingest --region ${esc(reg.id)} --limit 20000 --skip-unfloored
python3 search/harness.py --db search/sites.db greenfield  --region ${esc(reg.id)}
python3 search/harness.py --db search/sites.db colocation  --region ${esc(reg.id)}
python3 search/harness.py --db search/sites.db screen      --region ${esc(reg.id)} --limit 8000
python3 search/harness.py --db search/sites.db score       --region ${esc(reg.id)}
python3 search/harness.py --db search/sites.db rank        --region ${esc(reg.id)}`;

  return `<div class="crit"><section><h2>What this search runs on</h2>
    <p class="dim" style="font-size:13.5px">Read from the same <span class="mono">scoring.json</span> and region
    config the run used, not written here by hand. ${s ? `Coverage numbers are from run ${esc(String(s.run_id))}.`
      : "This region has not been run, so the floors are shown without coverage."}</p>
    <div class="gate">${cards}</div>
    <h3>What a parcel has to be to enter at all</h3>
    <ul style="font-size:13.5px;padding-left:18px;margin:6px 0">${entry}</ul>
    <h3>The fatal screens</h3>
    <p class="dim" style="font-size:13.5px">Any one of these can end a parcel outright. UNKNOWN is recorded and
    never counted as a pass: each of these needs a document no public layer holds.</p>
    ${scr}
    <h3>The score, metric by metric</h3>
    <p class="dim" style="font-size:13.5px">${c.metrics.length} metrics, weights summing to
    ${fx(c.metrics.reduce((a,m)=>a+(m.weight||0),0),2)}. A parcel scored on less than
    ${fx(g.min_weight_covered,2)} of that weight is not a finalist however good the measured part looks.
    Open one for the ladder it is graded on.</p>
    ${mets}
    ${mw}
    <h3>What produces the board</h3>
    <div class="ask">${cmds}</div>
    </section></div>`;
}

function show(reg, s){
  if (VIEW === "template"){
    el("body").innerHTML = templateHtml();
    el("foot").innerHTML = `Template state exported by <span class="mono">search/scan_template.py</span>; the background scan daemon writes <span class="mono">daemon.json</span> every tick.`;
    return;
  }
  if (VIEW === "criteria"){
    el("body").innerHTML = criteriaHtml(reg, s);
    el("foot").innerHTML = `Criteria for <span class="mono">${esc(reg.id)}</span>, exported from
      <span class="mono">scoring.json</span> and <span class="mono">regions/${esc(reg.id)}.json</span>.`;
    return;
  }
  if (!s){ el("body").innerHTML = notRunHtml(reg); header(reg, {}); el("foot").innerHTML =
    `Region <span class="mono">${esc(reg.id)}</span>. Bounds from US Census TIGERweb state geometry &mdash; a bounding box is not the state, so the outline does the containing.`; return; }
  el("body").innerHTML = funnelHtml(s) + `<div id="mapslot"></div>` + sitesHtml(s)
    + publishersHtml(s) + metricsHtml(s) + screensHtml(s) + ledgerHtml(s);
  loadMap(R.find(r => r.id === s.region) || {id: s.region, name: s.region});
  el("foot").innerHTML = `Region <span class="mono">${esc(s.region)}</span>, run ${s.run_id}`
    + (s.ranked_at ? `, finished ${esc(s.ranked_at.slice(0,16).replace("T"," "))} UTC` : "")
    + `. Full board (every candidate, screen and metric) exported to <span class="mono">boards/${esc(s.region)}.js</span>.`;
}

function select(id, push){
  const reg = R.find(r => r.id === id) || R[0];
  el("region").value = reg.id;
  try{ localStorage.setItem("region", reg.id); }catch(e){}
  if (push !== false && location.hash.slice(1) !== reg.id) location.hash = reg.id;
  header(reg, cache[reg.id] || {});
  if (reg.status !== "ranked" || !RANKED.has(reg.id)) return show(reg, null);
  if (cache[reg.id]) return show(reg, cache[reg.id]);
  el("body").innerHTML = `<p class="dim">Loading ${esc(reg.name)}…</p>`;
  window.__BOARD_SUMMARY__ = data => { cache[data.region] = data;
    if (el("region").value === data.region) show(reg, data); };
  const sc = document.createElement("script");
  sc.src = "summaries/" + reg.id + ".js";
  sc.onerror = () => { el("body").innerHTML =
    `<div class="notrun"><h2>Board file missing</h2><p>This region is marked ranked but
     <span class="mono">summaries/${esc(reg.id)}.js</span> did not load. Reporting that rather than drawing an empty board.</p></div>`; };
  document.head.appendChild(sc);
}
