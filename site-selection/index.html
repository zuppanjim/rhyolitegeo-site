/* ---------- template tab ----------
   One template (scan_region.sh) builds every state. A board built on an older
   template is STALE; the background daemon rescans stale boards one at a time
   under its resource governor. This tab shows that construct and files scan
   requests into the same store the Scan button uses. */
let TFILTER = "all", CUTDOC = null;
const CUTF = [["finalist_count","Finalists per state",1,1],["min_weighted_score","Finalist score bar",0.01,0],
  ["min_weight_covered","Coverage floor",0.01,0],["near_miss_score","Near-miss bar",0.01,0]];
function cutHtml(T){
  const c = T.cut || {}, p = CUTDOC && CUTDOC.status === "pending" ? CUTDOC : null;
  const line = !CUTDOC ? "" : CUTDOC.status === "pending"
      ? `<b>Pending</b> — filed ${esc(when(CUTDOC.requested_at))}; the runner lands it and re-ranks every scanned state${CUTDOC.note ? " · " + esc(CUTDOC.note) : ""}`
      : CUTDOC.status === "applied" ? `Last change applied ${esc(when(CUTDOC.applied_at))}${CUTDOC.commit ? " as " + esc(String(CUTDOC.commit).slice(0,7)) : ""}` : "";
  return `<h3>Cut</h3>
    <p class="dim">Which scored parcels become finalists. Scores are read on measured evidence only; a door no parcel
    in a state could measure is never counted against it. Changing a bar re-ranks every scanned state in seconds, no rescan.</p>
    <div class="gov">${CUTF.map(([k,lab,step]) => `<div><label for="cut-${k}">${lab}</label>
      <input id="cut-${k}" data-cut="${k}" type="number" step="${step}" min="0" ${k==="finalist_count"?"":'max="1"'}
        value="${esc(String(p && p[k] != null ? p[k] : c[k] != null ? c[k] : ""))}"
        style="width:100%;font:600 15px 'IBM Plex Mono',monospace;margin-top:4px">
      <span class="dim">now ${esc(String(c[k] ?? "?"))}</span></div>`).join("")}</div>
    <div class="tbar"><button type="button" id="cutapply" ${!scanDb ? "disabled" : ""}>Apply cut</button>
      <span class="dim" id="cutmsg">${line}</span></div>`;
}
const TSTATUS = {current:"Current", stale:"Stale", running:"Running", queued:"Queued",
  failed:"Failed", never_scanned:"Never scanned"};
function tStatus(st){
  const q = SCANS[st.id];
  if (q && (q.status === "queued" || q.status === "running")) return q.status;
  return st.status || "never_scanned";
}
function templateHtml(){
  const T = window.SCAN_TEMPLATE;
  if (!T) return `<div class="empty"><p><b>Template data not loaded.</b> <span class="mono">template.js</span>
    ${window.SCAN_TEMPLATE_MISSING ? "is not published yet" : "did not define SCAN_TEMPLATE"}; the next scan's export stage writes it.
    Reporting that rather than drawing an empty table.</p></div>`;
  const states = (T.states || []).slice().sort((a,b) => (a.name||a.id).localeCompare(b.name||b.id));
  const counts = {}; states.forEach(s => { const k = tStatus(s); counts[k] = (counts[k]||0) + 1; });
  const stale = states.filter(s => tStatus(s) === "stale");
  const rows = states.filter(s => TFILTER === "all" || tStatus(s) === TFILTER);
  const d = T.daemon || {}, g = d.governor || {};
  const govCells = Object.keys(g).map(k => {
    const v = g[k]; const val = v && typeof v === "object" ? (v.value ?? JSON.stringify(v)) : v;
    const lim = v && typeof v === "object" && v.limit != null ? ` <span class="dim">limit ${esc(String(v.limit))}</span>` : "";
    return `<div>${esc(k.replace(/_/g," "))}<b>${esc(String(val))}</b>${lim}</div>`; }).join("");
  const stageIds = (T.stages || []).map(x => x.id);
  const busy = Object.values(SCANS).some(q => q.status === "queued" || q.status === "running");
  return `<section class="block"><h2>Template</h2>
    <p class="dim">Every state is scanned and built by one template, <span class="mono">scan_region.sh</span>,
    version <span class="mono">${esc(T.version || "?")}</span> at commit <span class="mono">${esc((T.commit||"").slice(0,9))}</span>.
    A board built on an older version is <b>stale</b> and is rescanned in the background, one state at a time.</p>
    <h3>Background scanner</h3>
    <p>${esc(d.state || "unknown")}${d.current ? " — " + esc(d.current) : ""}${d.reason ? " · " + esc(d.reason) : ""}
      <span class="dim">${d.updated_at ? " · checked " + esc(ago(d.updated_at)) + " ago" : ""}
      ${Array.isArray(d.queue) ? " · " + d.queue.length + " in queue" : ""}</span></p>
    ${govCells ? `<div class="gov">${govCells}</div>` : ""}
    ${cutHtml(T)}
    <h3>Stages, in order</h3>
    <ol class="stages">${(T.stages||[]).map(x => `<li><b class="mono">${esc(x.id)}</b> — ${esc(x.measures || "")}
      ${x.source ? `<span class="src">(${esc(x.source)})</span>` : ""}</li>`).join("")}</ol>
    <h3>States</h3>
    <div class="tbar">
      <select id="tfilter" aria-label="Filter by status">
        <option value="all">All ${states.length}</option>
        ${Object.keys(TSTATUS).map(k => `<option value="${k}"${TFILTER===k?" selected":""}>${TSTATUS[k]} (${counts[k]||0})</option>`).join("")}
      </select>
      <button type="button" id="trescan" ${!scanDb || !stale.length ? "disabled" : ""}>Rescan all stale (${stale.length})</button>
      <span class="dim" id="tmsg">${!scanDb ? "This view cannot file scan requests." : ""}</span>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>State</th><th>Status</th><th>Built on</th><th>Last scan</th><th>Parcels</th><th>Measurable</th><th>Finalists</th><th>Near miss</th><th>Fatal</th><th>Below cut</th><th>Stages measured</th><th></th></tr></thead>
      <tbody>${rows.map(s => { const st = tStatus(s), doors = s.doors || {};
        const n = stageIds.filter(k => doors[k] === "MEASURED").length;
        return `<tr class="trow"><td>${esc(s.name || s.id)}</td>
        <td><span class="tst ${st}">${esc(TSTATUS[st] || st)}</span></td>
        <td class="n">${esc(s.built_on ? String(s.built_on).slice(0,9) : "—")}</td>
        <td class="n">${esc(s.last_scan ? when(s.last_scan) : "—")}</td>
        <td class="n">${s.parcels != null ? Number(s.parcels).toLocaleString() : "—"}</td>
        <td class="n" title="Share of the declared scoring weight any parcel in this state could be measured on">${s.measurable_weight != null ? Math.round(100*s.measurable_weight) + "%" : "—"}</td>
        ${(k => ["FINALIST","NEAR_MISS","FATAL","BELOW_CUT"].map(c => `<td class="n">${k ? (c === "FATAL" ? (k.FATAL||0)+(k.FATAL_1||0) : (k[c]||0)).toLocaleString() : "—"}</td>`).join(""))(s.cut_counts)}
        <td><div class="doors" title="${esc(stageIds.map(k => k + ": " + (doors[k] || "UNKNOWN")).join("\n"))}">
          ${stageIds.map(k => `<span class="door ${esc(doors[k] || "UNKNOWN")}"></span>`).join("")}</div>
          <span class="dim">${stageIds.length ? n + " of " + stageIds.length : ""}</span></td>
        <td><button type="button" data-tscan="${esc(s.id)}" ${!scanDb || st === "queued" || st === "running" ? "disabled" : ""}>
          ${st === "never_scanned" ? "Scan" : "Rescan"}</button></td></tr>`; }).join("")}</tbody>
    </table></div>
    <p class="dim" style="margin-top:10px">Green square: stage measured. Amber: reported UNMEASURED. Grey: unknown.
    Scans run one at a time because every stage writes the one database${busy ? "; one is in flight now" : ""}.</p>
  </section>`;
}
async function fileScan(id){
  const T = window.SCAN_TEMPLATE || {}, s = (T.states || []).find(x => x.id === id) || {};
  const at = new Date().toISOString();
  await scanDb.doc("scans/" + id).set({region: id, name: s.name || id,
    action: s.status === "never_scanned" ? "first scan" : "rescan", status: "queued", requested_at: at});
  SCANS[id] = {status: "queued", requested_at: at};
}
document.addEventListener("change", e => {
  if (e.target && e.target.id === "tfilter"){ TFILTER = e.target.value; if (VIEW === "template") el("body").innerHTML = templateHtml(); }
});
document.addEventListener("click", async e => {
  if (e.target && e.target.id === "cutapply"){
    if (!scanDb) return;
    const doc = {status:"pending", requested_at:new Date().toISOString()}; let bad = "";
    CUTF.forEach(([k,lab,,isInt]) => { const v = Number(el("cut-" + k).value);
      if (!isFinite(v) || v < 0 || (!isInt && v > 1) || (isInt && (v < 1 || v !== Math.round(v)))) bad = lab; doc[k] = v; });
    if (bad){ el("cutmsg").textContent = bad + " is out of range"; return; }
    e.target.disabled = true;
    try { await scanDb.doc("settings/cut").set(doc); CUTDOC = doc; el("body").innerHTML = templateHtml(); }
    catch(err){ e.target.disabled = false; el("cutmsg").textContent = "Not filed — " + ((err && err.message) || "store refused it"); }
    return;
  }
  const t = e.target.closest ? e.target.closest("[data-tscan],#trescan") : null;
  if (!t || !scanDb || t.disabled) return;
  t.disabled = true;
  const ids = t.id === "trescan"
    ? (window.SCAN_TEMPLATE.states || []).filter(s => tStatus(s) === "stale").map(s => s.id)
    : [t.getAttribute("data-tscan")];
  let bad = 0;
  for (const id of ids){ try { await fileScan(id); } catch(err){ bad++; } }
  if (VIEW === "template") el("body").innerHTML = templateHtml();
  const m = el("tmsg"); if (m) m.textContent = bad ? bad + " request(s) refused by the store" : ids.length + " scan request(s) filed";
  renderScan();
});

/* ---------- scan requests ----------
   The harness runs on the owner's machine, not in this page. Scan files a
   request in the artifact's store (scans/<region id>); the local runner picks
   it up, runs ingest → greenfield → colocation → screen → score → rank, then
   republishes this page and marks the request done. The page only asks. */
let SCANS = {}, scanDb = null;
const when = t => t ? new Date(t).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : "";
function renderScan(){
  const id = el("region").value, r = R.find(x => x.id === id), b = el("scan"), line = el("scanline");
  if (!r || !scanDb){ b.hidden = true; line.textContent = ""; return; }
  b.hidden = false;
  const q = SCANS[id], busy = q && (q.status === "queued" || q.status === "running");
  b.textContent = r.status === "ranked" ? "Rescan" : "Scan";
  b.disabled = r.status === "empty" || busy;
  b.title = r.status === "empty" ? "No keyable parcel layer published — nothing to scan"
    : busy ? "A scan of this region is already " + q.status : "Run the harness for " + r.name;
  line.className = "scanline" + (q && q.status === "failed" ? " fail" : "");
  line.innerHTML = !q ? "" :
    q.status === "queued"  ? `<b>Queued</b> ${esc(when(q.requested_at))} — waits for the runner on the owner's machine` :
    q.status === "running" ? `<b>Running</b> since ${esc(when(q.started_at))}${q.stage ? " · " + esc(q.stage) : ""}` :
    q.status === "done"    ? `<b>Scanned</b> ${esc(when(q.finished_at))}` :
    q.status === "failed"  ? `<b>Scan failed</b> ${esc(when(q.finished_at))}${q.note ? " — " + esc(q.note) : ""}` : "";
  renderProgress(r, q, busy);
}
const STAGES = (window.SCAN_TEMPLATE && (window.SCAN_TEMPLATE.stages||[]).map(x => x.id).length)
  ? window.SCAN_TEMPLATE.stages.map(x => x.id)
  : ["anchors","stage0","ingest","eia","greenfield","hostdocs","colocation","solarhosts","plannedsolar","screen","score","rank","listings","export"];
const ago = t => { const m = Math.max(0, Math.round((Date.now() - new Date(t)) / 60000));
  return m < 60 ? m + " min" : Math.floor(m/60) + " h " + (m % 60) + " min"; };
function renderProgress(r, q, busy){
  const box = el("scanprog");
  if (!busy){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  const i = q.status === "running" ? Math.max(0, STAGES.indexOf(q.stage)) : -1;
  const pct = i < 0 ? 0 : Math.round(100 * i / STAGES.length);
  box.className = "scanprog" + (i < 0 ? " wait" : "");
  box.innerHTML = `<div class="top"><span><b>${q.status === "running" ? "Scanning" : "Queued"}</b> ${esc(r.name)}`
    + (i < 0 ? " — waiting for the runner" : ` — ${esc(q.stage)}, stage ${i+1} of ${STAGES.length}`) + `</span>`
    + `<span>${q.status === "running" && q.started_at ? "running " + ago(q.started_at)
        : q.requested_at ? "filed " + ago(q.requested_at) + " ago" : ""}</span></div>`
    + `<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${STAGES.length}" aria-valuenow="${Math.max(0,i)}">`
    + `<div class="fill" style="width:${pct}%"></div></div>`
    + `<div class="steps">` + STAGES.map((st,k) =>
        `<span class="${k < i ? "done" : k === i ? "now" : ""}">${st}</span>`).join("") + `</div>`;
}
setInterval(() => { if (!el("scanprog").hidden) renderScan(); }, 60000);
el("region").addEventListener("change", renderScan);
el("scan").addEventListener("click", async () => {
  const id = el("region").value, r = R.find(x => x.id === id), b = el("scan");
  if (!r || !scanDb || b.disabled) return;
  b.disabled = true;
  const prev = SCANS[id];
  SCANS[id] = {status:"queued", requested_at: new Date().toISOString()};
  renderScan();
  try {
    await scanDb.doc("scans/" + id).set({region: id, name: r.name,
      action: r.status === "ranked" ? "rescan" : "first scan",
      status: "queued", requested_at: SCANS[id].requested_at});
  } catch (e) {
    SCANS[id] = prev;
    renderScan();
    el("scanline").className = "scanline fail";
    el("scanline").innerHTML = `<b>Request not filed</b> — ${esc(e && e.code === "not_granted"
      ? "this view cannot write scan requests" : (e && e.message) || "store refused it")}`;
  }
});
(async () => {
  if (typeof claude === "undefined" || !claude.use) return;
  const db = await claude.use("db");
  if (!db) return;
  scanDb = db;
  db.doc("settings/cut").onSnapshot(d => {
    CUTDOC = d && d.exists ? d.data() : null;
    if (VIEW === "template" && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.cut))
      el("body").innerHTML = templateHtml();
  }, () => {});
  db.collection("scans").onSnapshot(q => {
    const next = {};
    q.docs.forEach(d => { next[d.id] = d.data(); });
    SCANS = next;
    renderScan();
    if (VIEW === "template") el("body").innerHTML = templateHtml();
  }, () => {});
  renderScan();
})();
el("views").addEventListener("click", e => {
  const b = e.target.closest ? e.target.closest("button[data-v]") : null;
  if (!b || b.getAttribute("data-v") === VIEW) return;
  VIEW = b.getAttribute("data-v");
  document.querySelectorAll("#views button").forEach(n =>
    n.classList.toggle("on", n.getAttribute("data-v") === VIEW));
  select(el("region").value, false);
});
window.addEventListener("hashchange", () => select(location.hash.slice(1), false));
let start = location.hash.slice(1);
if (!start){ try{ start = localStorage.getItem("region") || ""; }catch(e){} }
select(R.some(r => r.id === start) ? start : "nv-statewide");
</script>
