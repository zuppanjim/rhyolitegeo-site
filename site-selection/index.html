<title>Rhyolite Site Selection</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#eef1f4;
  --panel:#ffffff;
  --ink:#17212b;
  --muted:#5b6976;
  --faint:#8a96a1;
  --rule:#d3dae1;
  --viridian:#0e7683;
  --slate:#0b5c66;
  --alarm:#b03a2e;
  --amber:#8e6f14;
  /* Map layers get their OWN hues, one per layer, far apart on the wheel, so
     the layer is readable from the colour alone without the legend. The page
     palette is deliberately close-toned and cannot do that job. */
  --m-power:#d1451c;        /* transmission line, red-orange */
  --m-power-hv:#8f2a0a;     /* 345 kV and up */
  --m-fiber:#0082ad;        /* completed fiber route, cyan */
  --m-fiber-plan:#12a6c9;   /* planned or under construction, dashed */
  --m-ring:#7338ad;         /* generation anchor and its reach, violet */
  --m-pop:#9c6a00;          /* carrier point of presence, gold */
  --m-site:#0d6b3e;         /* ranked site, green */
  --m-tower:#7f8682;        /* licensed structure, neutral */
  --m-solar:#b0287a;        /* solar farm host, magenta */
  --m-host:#2556c4;         /* colocation host, blue */
  --m-cold:#2a7d8c;         /* brownfield cold storage, ice teal */
  --m-plant:#7a4a26;        /* brownfield heavy-power plant, brown */
  --m-dc:#3b4aa0;           /* existing data center, indigo */
  --m-mine:#a8560c;         /* existing crypto-mining site, burnt orange */
  --m-cand:#c0262d;         /* IDLE or CLOSED facility ring, red */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#11171d;
    --panel:#1a2229;
    --ink:#e3e9ee;
    --muted:#93a1ad;
    --faint:#6e7c88;
    --rule:#2b3640;
    --viridian:#3fb2bb;
    --slate:#7ed0d6;
    --alarm:#e4796b;
    --amber:#d8b04e;
    --m-power:#ff8a52;
    --m-power-hv:#ff5a2b;
    --m-fiber:#3ed2ec;
    --m-fiber-plan:#79e4f6;
    --m-ring:#bd9bf7;
    --m-pop:#eab73f;
    --m-site:#4fd396;
    --m-tower:#868d88;
  --m-solar:#f06fb8;
    --m-solar:#f06fb8;
    --m-host:#7fa6ff;
    --m-cold:#7ccfdc;
    --m-plant:#d0a07a;
    --m-dc:#9ea9f5;
    --m-mine:#f5a453;
    --m-cand:#ff7474;
  }
}
:root[data-theme="dark"]{
  --ground:#11171d;
  --panel:#1a2229;
  --ink:#e3e9ee;
  --muted:#93a1ad;
  --faint:#6e7c88;
  --rule:#2b3640;
  --viridian:#3fb2bb;
  --slate:#7ed0d6;
  --alarm:#e4796b;
  --amber:#d8b04e;
  --m-power:#ff8a52;
  --m-power-hv:#ff5a2b;
  --m-fiber:#3ed2ec;
  --m-fiber-plan:#79e4f6;
  --m-ring:#bd9bf7;
  --m-pop:#eab73f;
  --m-site:#4fd396;
  --m-tower:#868d88;
  --m-solar:#f06fb8;
  --m-host:#7fa6ff;
  --m-cold:#7ccfdc;
  --m-plant:#d0a07a;
  --m-dc:#9ea9f5;
  --m-mine:#f5a453;
  --m-cand:#ff7474;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);
  font-family:"Work Sans",system-ui,sans-serif;font-size:15px;line-height:1.55;
  padding-block:28px;padding-left:18px;padding-right:18px}
.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:288px 1fr;gap:34px;align-items:start}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,3.4vw,38px);line-height:1.05}
h2{font-size:19px;margin-bottom:12px}
.lab{font-family:"Work Sans",sans-serif;font-size:10px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
p{margin:0 0 10px;max-width:68ch;color:var(--ink)}
p.dim{color:var(--muted)}

/* ---- sidebar ---- */
aside{position:sticky;top:20px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;flex-direction:column;gap:2px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.brand b{font-family:Fraunces,serif;font-size:21px;font-weight:700}
.brand .logo{display:block;width:100%;height:auto;margin:0 0 10px -4px}
.brand .logo-light{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo-dark{display:none}:root:not([data-theme="light"]) .brand .logo-light{display:block}}
:root[data-theme="dark"] .brand .logo-dark{display:none}:root[data-theme="dark"] .brand .logo-light{display:block}
select{width:100%;font-family:"Work Sans",sans-serif;font-size:15px;font-weight:500;color:var(--ink);
  background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:10px 11px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select:focus-visible{outline:2px solid var(--viridian);outline-offset:1px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--muted)}
.legend div{display:flex;gap:8px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:6px}
.dot.r{background:var(--viridian)}.dot.y{background:var(--amber)}.dot.n{background:var(--rule)}
.tally{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;padding-top:14px;border-top:1px solid var(--rule)}
.tally b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.tally span{color:var(--muted)}

/* ---- content ---- */
main{display:flex;flex-direction:column;gap:38px;min-width:0}
.runline{display:flex;flex-wrap:wrap;gap:6px 20px;padding-top:11px;margin-top:12px;border-top:1px solid var(--rule)}
.runline div{font-size:13px;display:flex;gap:6px;align-items:baseline}
.runline b{font-family:"IBM Plex Mono",monospace;font-weight:600}

.funnel{display:flex;flex-wrap:wrap;gap:2px}
.fstep{flex:1 1 118px;background:var(--panel);border-top:3px solid var(--rule);padding:11px 12px}
.fstep.keep{border-top-color:var(--viridian)}
.fstep.cut{border-top-color:var(--alarm)}
.fstep .n{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600;display:block;line-height:1.15}
.fstep .t{font-size:11.5px;color:var(--muted);display:block;margin-top:3px}

ol.sites{list-style:none;margin:0;padding:0}
ol.sites li{display:grid;grid-template-columns:40px 1fr auto;gap:0 14px;align-items:baseline;
  padding:13px 0;border-top:1px solid var(--rule)}
ol.sites li:first-child{border-top:2px solid var(--ink)}
.rk{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600;color:var(--slate)}
.apn{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.nm{font-family:Fraunces,serif;font-size:17px;font-weight:700}
.chips{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--rule);
  border-radius:2px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.scw{text-align:right}
.sc{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;display:block}

.scroll{overflow-x:auto}
.tst{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.04em;
  border:1px solid currentColor;border-radius:2px;padding:1px 6px;white-space:nowrap}
.tst.current{color:var(--viridian)} .tst.stale{color:var(--amber)} .tst.failed{color:var(--alarm)}
.tst.running,.tst.queued{color:var(--slate)} .tst.never_scanned{color:var(--faint)}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 14px}
.tbar select{width:auto;font-size:13px}
.tbar button,.trow button{font:500 12px "Work Sans",system-ui,sans-serif;padding:5px 10px;border:1px solid var(--ink);
  background:var(--panel);color:var(--ink);border-radius:2px;cursor:pointer}
.tbar button:disabled,.trow button:disabled{opacity:.45;cursor:default}
.doors{display:flex;flex-wrap:wrap;gap:3px}
.door{width:9px;height:9px;border-radius:1px;background:var(--rule)}
.door.MEASURED{background:var(--viridian)} .door.UNMEASURED{background:var(--amber)}
.gov{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0 16px}
.gov div{border:1px solid var(--rule);border-radius:2px;padding:8px 10px;background:var(--panel);font-size:12.5px}
.gov b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px}
ol.stages{margin:6px 0 16px;padding-left:22px;font-size:13.5px}
ol.stages li{margin:3px 0} ol.stages .src{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  font-weight:600;border-bottom:1px solid var(--rule);padding:5px 12px 5px 0;white-space:nowrap}
td{padding:6px 12px 6px 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td.zero{color:var(--faint)}
.bar{display:inline-block;height:7px;background:var(--viridian);vertical-align:middle;min-width:2px}
.bar.z{background:var(--rule);width:2px}

.ledger .row{display:grid;grid-template-columns:168px 1fr;gap:16px;padding:11px 0;border-top:1px solid var(--rule)}
.ledger .row:first-child{border-top:2px solid var(--alarm)}
.ledger .k{font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--alarm);font-family:"IBM Plex Mono",monospace;word-break:break-word}
.ledger .v{font-size:14px;color:var(--ink)}
.ledger .out{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);display:block;margin-top:3px}

.notrun{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--amber);padding:20px 22px}
.notrun h2{margin-bottom:8px}
.notrun .ask{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--ground);
  border:1px solid var(--rule);border-radius:3px;padding:9px 11px;margin-top:14px;overflow-x:auto;white-space:pre}
/* ---- map ---- */
.mapbox{border:1px solid var(--rule);background:var(--panel);border-radius:2px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;max-width:100%}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;align-items:start}
@media (max-width:760px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.mlegend{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--rule);border-radius:2px;background:var(--panel);font-size:12.5px;color:var(--muted)}
.mlegend .lh{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.mlegend i{flex:none}
.mlegend span.k{display:inline-flex;align-items:center;gap:6px}
.mlegend i{display:inline-block;width:15px;height:0;border-top-width:2px;border-top-style:solid}
.mlegend i.sq{width:8px;height:8px;border:0;border-radius:1px}
.mlegend i.ci{width:9px;height:9px;border:0;border-radius:50%}
.mlegend i.dm{width:9px;height:9px;border:0;transform:rotate(45deg)}
.mlegend i.tr{width:0;height:0;border-top:0;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom-width:9px;border-bottom-style:solid}
.mapnote{font-size:12.5px;color:var(--amber);margin-top:8px}
.hit{cursor:pointer}
.hit.on circle,.hit.on{filter:drop-shadow(0 0 3px var(--ink))}
.mdetail{margin-top:10px;padding:12px 14px;border:1px solid var(--rule);border-radius:2px;background:var(--panel)}
.mdetail.open{border-left:3px solid var(--m-site)}
.mdetail h3{font-family:Fraunces,serif;font-size:16px;margin:0 0 4px}
.mdetail .lab{display:block;padding-top:9px;border-top:1px solid var(--rule)}
dl.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:8px 22px;margin:0}
dl.rec dt{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
dl.rec dd{margin:1px 0 0;font-family:"IBM Plex Mono",monospace;font-size:13px;
  font-variant-numeric:tabular-nums;word-break:break-word}
dl.rec dd.unk{font-family:"Work Sans",sans-serif;color:var(--faint);font-style:italic}
svg.genchart{display:block;width:100%;height:auto;max-width:100%;font-family:"Work Sans",sans-serif}
.genleg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:6px}
.genleg i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px}
.genleg i.np{height:0;border-top:2px dashed;background:none;margin-left:4px}
table.gentbl{font-size:12.5px}table.gentbl .unk{font-family:"Work Sans",sans-serif;color:var(--faint);font-style:italic}
.rsrc{font-size:12px;color:var(--muted);margin:12px 0 0;max-width:70ch}
.hev .q{color:var(--dim);font-size:12.5px}.hev .t{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);margin-left:4px}
.hev .u{color:var(--faint);font-style:italic}
.srcl{margin:0;padding-left:18px;font-size:13px}.srcl li{margin:2px 0}.srcl a{color:inherit;text-decoration:underline;word-break:break-word}
.mn{font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;fill:var(--panel)}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media(max-width:820px){
  .shell{grid-template-columns:1fr;gap:26px}
  aside{position:static}
}
@media(max-width:520px){
  ol.sites li{grid-template-columns:32px 1fr}
  .scw{grid-column:2;text-align:left;margin-top:4px}
  .ledger .row{grid-template-columns:1fr;gap:3px}
}
.lbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 8px;
  padding:9px 11px;background:var(--panel);border:1px solid var(--rule);border-radius:7px}
.lchk{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;
  font-family:"Work Sans",system-ui,sans-serif;color:var(--ink)}
.lchk input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.lchk{position:relative;user-select:none}
.lchk:hover span{color:var(--ink)}
.lchk input:focus-visible+span{outline:2px solid var(--viridian);outline-offset:2px}
.lchk b{font-family:"IBM Plex Mono",monospace;font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--dim);margin-left:5px;font-weight:500}
.lchk input:not(:checked)+span{opacity:.45;text-decoration:line-through}
.mapbox.h-site g[data-l="site"],.mapbox.h-anchor g[data-l="anchor"],
.mapbox.h-ring g[data-l="ring"],.mapbox.h-fiber g[data-l="fiber"],
.mapbox.h-power g[data-l="power"],.mapbox.h-pop g[data-l="pop"],
.mapbox.h-tower g[data-l="tower"],.mapbox.h-solar g[data-l="solar"],
.mapbox.h-host g[data-l="host"],.mapbox.h-brown g[data-l="brown"],
.mapbox.h-fac g[data-l="fac"]{display:none}
.mapbox.h-fplan g[data-l="fiber"] path[data-s="plan"]{display:none}
/* the criteria view */
.crit h3{font-family:Fraunces,serif;font-size:15px;margin:22px 0 6px}
.crit .gate{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.crit .gate div{flex:1 1 150px;background:var(--panel);border:1px solid var(--rule);
  border-radius:7px;padding:10px 12px}
.crit .gate b{display:block;font-family:"IBM Plex Mono",monospace;font-size:19px;
  font-variant-numeric:tabular-nums;margin-top:3px}
.crit .lad{margin:4px 0 0;padding-left:0;list-style:none;font-size:12.5px;color:var(--dim)}
.crit .lad li{padding:2px 0}
.crit .lad span{font-family:"IBM Plex Mono",monospace;color:var(--ink);margin-right:7px}
.crit details{border-top:1px solid var(--rule);padding:8px 0}
.crit summary{cursor:pointer;font-size:13.5px}
.crit summary b{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
nav.views{display:flex;gap:4px;margin-top:14px}
nav.views button{flex:1;font:500 12px "Work Sans",system-ui,sans-serif;padding:7px 8px;
  background:var(--panel);color:var(--dim);border:1px solid var(--rule);border-radius:6px;cursor:pointer}
nav.views button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pick{display:flex;gap:6px;margin-top:6px;align-items:stretch}
.pick select{flex:1;min-width:0}
.scanbtn{flex:none;font:600 12.5px "Work Sans",system-ui,sans-serif;padding:0 14px;border-radius:6px;cursor:pointer;background:var(--viridian);color:var(--panel);border:1px solid var(--viridian)}
.scanbtn:disabled{opacity:.4;cursor:not-allowed}
.scanline{font-size:12px;color:var(--muted);margin-top:6px;min-height:1em}
.scanline b{color:var(--ink);font-weight:600}
.scanline.fail b{color:var(--alarm)}
.scanprog{margin-top:14px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--panel)}
.scanprog .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.scanprog .top b{color:var(--ink);font-weight:600}
.scanprog .track{position:relative;height:8px;margin-top:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.scanprog .fill{position:absolute;inset:0 auto 0 0;background:var(--viridian);border-radius:4px;transition:width .6s ease}
.scanprog.wait .fill{width:30%!important;animation:scanwait 1.6s ease-in-out infinite}
@keyframes scanwait{0%{left:-30%}100%{left:100%}}
.scanprog .steps{display:flex;gap:4px;margin-top:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint)}
.scanprog .steps span{flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scanprog .steps span.done{color:var(--viridian)}.scanprog .steps span.now{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){.scanprog.wait .fill{animation:none;left:0}}
</style>

<div class="shell">

<script>
const R = (window.REGIONS_DATA || {regions:[]}).regions;
const RANKED = new Set(window.BOARD_SUMMARIES || []);
const MAPPED = new Set(window.BOARD_MAPS || []);
// criteria.js is EXPORTED from scoring.json and the region config, never typed
// here: a threshold that moves in the config moves on this page and cannot
// quietly disagree with the run that produced the board.
const CRIT = window.BOARD_CRITERIA || {};
const cache = {}, mapCache = {};
const el = id => document.getElementById(id);
const num = n => n === null || n === undefined ? "—" : Number(n).toLocaleString();
const fx = (n,d) => n === null || n === undefined ? "—" : Number(n).toFixed(d);
const dist = f => f === null || f === undefined ? "—"
  : f < 1000 ? Math.round(f) + " ft" : (f/5280).toFixed(2) + " mi";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const titl = s => String(s||"").replace(/_/g," ");

/* ---------- dropdown ---------- */
function buildSelect(){
  const groups = [["Ranked","ranked"],["Not yet run","ready"],["No cadastre","empty"]];
  const sel = el("region");
  sel.innerHTML = groups.map(([label,st]) => {
    const rows = R.filter(r => r.status === st);
    if (!rows.length) return "";
    return `<optgroup label="${label} (${rows.length})">` + rows.map(r =>
      `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join("") + "</optgroup>";
  }).join("");
  const t = {ranked:0, ready:0, empty:0};
  R.forEach(r => t[r.status]++);
  el("tally").innerHTML =
    `<b>${t.ranked}</b><span>ranked</span><b>${t.ready}</b><span>awaiting a run</span>`
    + `<b>${t.empty}</b><span>no cadastre</span>`
    + `<b>${num(R.reduce((a,r)=>a+(r.jurisdictions||0),0))}</b><span>county layers admitted</span>`
    + `<b>${num(R.reduce((a,r)=>a+(r.excluded||0),0))}</b><span>publishers excluded, reason recorded</span>`;
}

/* ---------- renderers ---------- */
function header(reg, s){
  el("eyebrow").textContent = reg.status === "ranked"
    ? `region ${reg.id} · run ${s.run_id}` : `region ${reg.id}`;
  el("title").textContent = reg.name;
  const extent = reg.extent === "radius"
    ? `${reg.radius_miles} mile radius on ${reg.center.label || "the centre point"}`
    : "statewide, county cadastres only";
  el("blurb").textContent = reg.status === "ranked"
    ? `Parcels admitted at a ${reg.min_acres}-acre floor across ${reg.jurisdictions} county layers, ringed against EIA-860/923 generation anchors, screened, scored, ranked. ${extent}.`
    : `${extent}. ${reg.jurisdictions} county layers measured and admitted, ${reg.excluded} publishers excluded with a named reason.`;
  const bits = (reg.status === "ranked" && s && s.funnel) ? [
    ["parcels", num(s.funnel.parcels)],

function funnelHtml(s){
